name: Publish to npm

# Triggered automatically by pushing a `vX.Y.Z` tag, or manually via the Actions
# tab. The manual trigger has no opt-out toggle on purpose: invoking this
# workflow IS the intent to publish. The previous `publish=false` input made the
# job skip silently, which is exactly the failure mode this rewrite avoids.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version (if tag push)
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          if [[ "$TAG_REF" == refs/tags/* ]]; then
            TAG="${TAG_REF#refs/tags/}"
            PKG_VERSION="$(node -p "require('./package.json').version")"
            if [ "$TAG" != "v$PKG_VERSION" ] && [ "$TAG" != "$PKG_VERSION" ]; then
              echo "Release tag ($TAG) does not match package version ($PKG_VERSION)." >&2
              exit 1
            fi
          else
            echo "Manual dispatch — skipping tag/version match check."
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Confirm the package actually landed on the registry. Catches the silent
      # case where `npm publish` exits 0 but nothing reaches npm (registry
      # propagation, scoped-package auth quirks, empty tarball). Retries because
      # the registry can take a few seconds to expose a fresh version.
      - name: Verify package is published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "Confirmed $NAME@$VERSION is live on npm."
              exit 0
            fi
            echo "Attempt $attempt: $NAME@$VERSION not visible yet, retrying..."
            sleep 6
          done
          echo "Publish reported success but $NAME@$VERSION is not visible on npm." >&2
          exit 1
