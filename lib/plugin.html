                $('#git-return-to-latest').on('click', function() {
                    var branchToRestore = null;
                    if (projectInfo) {
                        branchToRestore = projectInfo.currentBranch || projectInfo.lastKnownBranch;
                    }
                    if (branchToRestore) {
                        executeGitOperation('checkout', { commitRef: branchToRestore }, function() {
                            reloadFlowsFromDisk(function() {
                                loadAll();
                            });
                        });
                    }
                });

                // Abort the in-progress merge/cherry-pick/revert/rebase (conflict banner)
                $('#git-conflict-abort').on('click', function() {
                    var kind = (projectInfo && projectInfo.mergeState && projectInfo.mergeState.kind) || 'operation';
                    if (!confirm('Abort the in-progress ' + kind + '?\n\nThis returns the repo to the state before it started. Any conflict resolutions you have not committed will be lost.')) {
                        return;
                    }
                    executeGitOperation('abort', {}, function() {
                        reloadFlowsFromDisk(function() { loadAll(); });
                    });
                });
            }

            function loadAll() {
                loadProjectInfo();
                loadBranches();
                loadCommits(50);
                loadChanges();
            }

            function loadProjectInfo() {
                $.ajax({
                    url: 'rosepetal-git/project-info',
                    type: 'GET',
                    success: function(result) {
                        if (result.success) {
                            projectInfo = result;
                            $('#git-project-name').text(result.projectName);
                            var branchLabel = result.currentBranch;
                            if (!branchLabel) {
                                branchLabel = result.lastKnownBranch ? 'detached (' + result.lastKnownBranch + ')' : 'detached HEAD';
                            }
                            $('#git-current-branch-name').text(branchLabel);
                            currentBranch = result.currentBranch;

                            // Update sync indicators
                            updateSyncIndicators(result.ahead, result.behind, result.hasTracking);

                            // Show/hide detached HEAD warning banner
                            if (result.isDetachedHead) {
                                $('#git-detached-head-banner').slideDown(200);
                            } else {
                                $('#git-detached-head-banner').slideUp(200);
                            }

                            renderConflictBanner(result);
                        }
                    },
                    error: function(xhr) {
                        RED.notify("Failed to load project info", "error");
                    }
                });
            }

            // Safety-net banner: when a merge/cherry-pick/revert/rebase is mid-flight
            // (usually after a conflict), list the conflicted files and offer Abort.
            function renderConflictBanner(info) {
                var ms = info.mergeState || {};
                var conflicted = info.conflicted || [];
                if (!ms.inProgress && conflicted.length === 0) {
                    $('#git-conflict-banner').slideUp(150);
                    return;
                }

                var kind = ms.kind || 'merge';
                if (conflicted.length) {
                    $('#git-conflict-title').text(kind.toUpperCase().replace('-', ' ') + ' CONFLICT');
                    $('#git-conflict-text').text(conflicted.length + ' file(s) have conflicts. Resolve them in your editor or on the command line, then commit — or abort to undo this ' + kind + '.');
                    $('#git-conflict-files').html(conflicted.map(function(f) {
                        return '<div>' + escapeHtml(f) + '</div>';
                    }).join(''));
                } else {
                    $('#git-conflict-title').text(kind.toUpperCase().replace('-', ' ') + ' IN PROGRESS');
                    $('#git-conflict-text').text('A ' + kind + ' is in progress. Commit to finish it, or abort to undo it.');
                    $('#git-conflict-files').empty();
                }
                $('#git-conflict-abort span').text('Abort ' + kind);
                $('#git-conflict-banner').slideDown(150);
            }

            function updateSyncIndicators(ahead, behind, hasTracking) {
                var $pullIndicator = $('#git-pull-indicator');
                var $pushIndicator = $('#git-push-indicator');
                var $pushBtn = $('#git-btn-push');

                if (behind > 0) {
                    $pullIndicator.text(behind).show();
                } else {
                    $pullIndicator.hide();
                }

                if (ahead > 0) {
                    $pushIndicator.text(ahead).show();
                } else {
                    $pushIndicator.hide();
                }

                var canPush = (ahead > 0) || !hasTracking;
                $pushBtn.prop('disabled', !canPush);

                if (!hasTracking) {
                    $pushBtn.attr('title', 'Push to publish this branch');
                } else if (ahead > 0 && behind > 0) {
                    $pushBtn.attr('title', 'Branch has diverged from remote — push will offer a force-push or you can pull first');
                } else {
                    $pushBtn.attr('title', 'Push to remote');
                }
            }

            function loadBranches() {
                $.ajax({
                    url: 'rosepetal-git/branches',
                    type: 'POST',
                    data: JSON.stringify({}),
                    contentType: 'application/json',
                    success: function(result) {
                        if (result.success) {
                            var $selector = $('#git-branch-selector');
                            $selector.empty();

                            result.all.forEach(function(branch) {
                                var isCurrent = branch === result.current;
                                $selector.append(
                                    $('<option>')
                                        .val(branch)
                                        .text(branch)
                                        .prop('selected', isCurrent)
                                );
                            });
                        }
                    }
                });
            }

            function loadCommits(maxCount) {
                $('#git-commits-loading').show();
                $('#git-commit-list').hide();

                $.ajax({
                    url: 'rosepetal-git/log',
                    type: 'POST',
                    data: JSON.stringify({ maxCount: maxCount || 50 }),
                    contentType: 'application/json',
                    success: function(result) {
                        if (result.success) {
                            allCommits = result.commits;
                            renderCommitList(result.commits);
                        }
                    },
                    error: function(xhr) {
                        $('#git-commits-loading').hide();
                        $('#git-commit-list').show().html('<div class="git-empty-state"><i class="fa fa-exclamation-triangle"></i><p>Failed to load commits</p></div>');
                    }
                });
            }

            // ---------- Commit list (DOM graph + SVG rail) ----------

            // Rail geometry. Each row owns a fixed-height SVG band; bands stack
            // edge-to-edge so vertical lines join across rows. Lane x positions
            // are global (driven by laneCount) so every row's body aligns.
            var RAIL_LANE_W = 18, RAIL_ROW_H = 56, RAIL_DOT_R = 5, RAIL_LINE = '#8a94a6';
            var EMPTY_TREE = '4b825dc642cb6eb9a060e54bf8d69288fbee4904'; // git's empty tree, used as a root commit's "before".

            function railLaneX(lane) { return lane * RAIL_LANE_W + RAIL_LANE_W / 2; }

            // Assign each commit (newest-first) a lane, tracking which lanes pass
            // through / merge into / branch out of each row. A lane "holds" the
            // hash of the parent it is waiting to reach; when a commit matches, the
            // lane connects down into it. The first parent continues the commit's
            // lane; extra parents open new lanes (merges).
            function computeLanes(commits) {
                var rows = [];
                var lanes = []; // lanes[i] = parent hash this column is waiting for, or null when free

                function freeLane() {
                    for (var i = 0; i < lanes.length; i++) {
                        if (lanes[i] == null) return i;
                    }
                    lanes.push(null);
                    return lanes.length - 1;
                }

                commits.forEach(function(commit) {
                    // Lanes already waiting for this commit (its children, drawn above).
                    var incoming = [];
                    var myLane = -1;
                    for (var i = 0; i < lanes.length; i++) {
                        if (lanes[i] === commit.hash) {
                            if (myLane === -1) myLane = i;
                            incoming.push(i);
                        }
                    }
                    if (myLane === -1) myLane = freeLane(); // a tip: nothing pointed here yet

                    var lanesBefore = lanes.slice();
                    // Merged-in duplicate lanes end at this commit.
                    incoming.forEach(function(l) { if (l !== myLane) lanes[l] = null; });

                    var parents = commit.parents || [];
                    var parentLanes = {};
                    if (parents.length === 0) {
                        lanes[myLane] = null; // root commit: the lane ends here
                    } else {
                        lanes[myLane] = parents[0];
                        parentLanes[parents[0]] = myLane;
                        for (var p = 1; p < parents.length; p++) {
                            var nl = freeLane();
                            lanes[nl] = parents[p];
                            parentLanes[parents[p]] = nl;
                        }
                    }

                    rows.push({
                        commit: commit,
                        lane: myLane,
                        incoming: incoming,
                        lanesBefore: lanesBefore,
                        lanesAfter: lanes.slice(),
                        parentLanes: parentLanes
                    });
                });

                var laneCount = 1;
                rows.forEach(function(r) {
                    laneCount = Math.max(laneCount, r.lanesBefore.length, r.lanesAfter.length, r.lane + 1);
                });
                return { rows: rows, laneCount: laneCount };
            }

            // Build one row's rail as an inline SVG: pass-through lanes, the commit's
            // own segment, merge curves in, branch curves out, then the dot on top.
            function railSvg(row, laneCount) {
                var W = Math.max(1, laneCount) * RAIL_LANE_W;
                var H = RAIL_ROW_H, cy = H / 2, cx = railLaneX(row.lane);
                var parts = [];
                function seg(x1, y1, x2, y2) {
                    parts.push('<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '" stroke="' + RAIL_LINE + '" stroke-width="2" fill="none"/>');
                }
                function curve(x1, y1, x2, y2) {
                    var my = (y1 + y2) / 2;
                    parts.push('<path d="M' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2 + '" stroke="' + RAIL_LINE + '" stroke-width="2" fill="none"/>');
                }

                var n = Math.max(row.lanesBefore.length, row.lanesAfter.length);
                for (var i = 0; i < n; i++) {
                    if (i === row.lane) continue;
                    var before = row.lanesBefore[i] != null;
                    var after = row.lanesAfter[i] != null;
                    var isIncoming = row.incoming.indexOf(i) !== -1;
                    if (before && after && !isIncoming) seg(railLaneX(i), 0, railLaneX(i), H); // straight through
                }

                // Commit's own lane: line up from the top if a child connected here,
                // line down to the bottom if the first parent continues.
                if (row.lanesBefore[row.lane] != null && row.incoming.indexOf(row.lane) !== -1) seg(cx, 0, cx, cy);
                if (row.lanesAfter[row.lane] != null) seg(cx, cy, cx, H);

                row.incoming.forEach(function(i) { if (i !== row.lane) curve(railLaneX(i), 0, cx, cy); });
                Object.keys(row.parentLanes).forEach(function(h) {
                    var pl = row.parentLanes[h];
                    if (pl !== row.lane) curve(cx, cy, railLaneX(pl), H);
                });

                var fill = row.commit.pushed ? '#4A90E2' : '#9B59B6'; // legend: pushed / unpushed
                // Stroke is set in CSS (.git-rail-dot) so it can use the --rail-bg
                // custom property - var() doesn't resolve in a presentation attribute.
                var dot = '<circle class="git-rail-dot" cx="' + cx + '" cy="' + cy + '" r="' + RAIL_DOT_R + '" fill="' + fill + '" stroke-width="2"/>';
                var head = row.commit.isHead
                    ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + (RAIL_DOT_R + 3) + '" fill="none" stroke="#27AE60" stroke-width="2"/>'
                    : '';
                return '<svg class="git-rail-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + parts.join('') + dot + head + '</svg>';
            }

            function renderCommitList(commits) {
                var $list = $('#git-commit-list');
                $('#git-commits-loading').hide();
                $list.show().empty();

                if (!commits || commits.length === 0) {
                    $list.html('<div class="git-empty-state"><i class="fa fa-info-circle"></i><p>No commits</p></div>');
                    return;
                }

                var layout = computeLanes(commits);
                layout.rows.forEach(function(row) {
                    var c = row.commit;
                    var $row = $('<div class="git-commit-row">').attr('data-hash', c.hash);
                    if (c.isHead) $row.addClass('head');

                    var chips = (c.branches || []).map(function(b) {
                        return '<span class="git-branch-chip">' + escapeHtml(b) + '</span>';
                    }).join('');

                    $row.html(
                        '<div class="git-commit-rail">' + railSvg(row, layout.laneCount) + '</div>' +
                        '<div class="git-commit-body">' +
                            '<div class="git-commit-row-top">' +
                                '<span class="git-commit-hashtag">' + escapeHtml(c.hash.substring(0, 7)) + '</span>' +
                                '<span class="git-commit-row-msg">' + escapeHtml(c.message) + '</span>' +
                                (c.isHead ? '<span class="git-head-chip">HEAD</span>' : '') +
                            '</div>' +
                            '<div class="git-commit-row-bottom">' +
                                chips +
                                '<span class="git-commit-row-meta">' + escapeHtml(c.author) + ' • ' + escapeHtml(getRelativeTime(c.date)) + '</span>' +
                            '</div>' +
                        '</div>'
                    );
                    $row.on('click', function() { toggleCommitDetail(c, $row); });
                    $list.append($row);

                    // Re-open the previously expanded commit after a refresh.
                    if (expandedHash === c.hash) {
                        $row.addClass('open');
                        $list.append(buildCommitDetail(c));
                    }
                });
            }

            // Expand/collapse the inline detail panel for a commit. The panel is a
            // sibling appended after the row (not nested), so it never disturbs the
            // rail alignment of the rows themselves.
            function toggleCommitDetail(commit, $row) {
                var $next = $row.next('.git-commit-detail');
                if ($next.length) {
                    $next.remove();
                    $row.removeClass('open');
                    expandedHash = null;
                    return;
                }
                $('.git-commit-detail').remove();
                $('.git-commit-row.open').removeClass('open');
                expandedHash = commit.hash;
                $row.addClass('open');
                $row.after(buildCommitDetail(commit));
            }

            function buildCommitDetail(commit) {
                // "Before" for this commit is its first parent; a root commit has
                // none, so diff against the empty tree (everything shows as added).
                var base = (commit.parents && commit.parents.length) ? commit.parents[0] : EMPTY_TREE;
                var shortBase = base === EMPTY_TREE ? '(root)' : base.substring(0, 7);

                var $d = $('<div class="git-commit-detail">');
                $d.html(
                    '<div class="git-commit-detail-meta">' +
                        '<div><span class="k">commit</span> <span class="git-mono">' + escapeHtml(commit.hash) + '</span> ' +
                            '<button class="git-commit-action git-copy-hash" title="Copy full hash"><i class="fa fa-clipboard"></i></button></div>' +
                        '<div><span class="k">author</span> ' + escapeHtml(commit.author) + ' &lt;' + escapeHtml(commit.email || '') + '&gt;</div>' +
                        '<div><span class="k">date</span> ' + escapeHtml(commit.date) + '</div>' +
                        '<div class="git-commit-detail-msg">' + escapeHtml(commit.message) + '</div>' +
                    '</div>' +
                    '<div class="git-commit-detail-actions">' +
                        '<button class="git-commit-action" data-act="checkout"><i class="fa fa-code-fork"></i> Checkout</button>' +
                        '<button class="git-commit-action" data-act="branch"><i class="fa fa-plus"></i> Branch here</button>' +
                        '<button class="git-commit-action" data-act="reset-mixed"><i class="fa fa-dot-circle-o"></i> Reset here</button>' +
                        '<button class="git-commit-action" data-act="revert"><i class="fa fa-undo"></i> Revert</button>' +
                        '<button class="git-commit-action git-commit-action-danger" data-act="reset-hard"><i class="fa fa-exclamation-triangle"></i> Reset --hard</button>' +
                    '</div>' +
                    '<div class="git-commit-detail-section">' +
                        '<div class="git-commit-detail-subhead">Changed flows <span class="git-detail-sub">vs ' + escapeHtml(shortBase) + '</span></div>' +
                        '<div class="git-commit-flows"><div class="git-loading-state"><i class="fa fa-spinner fa-spin"></i><p>Loading…</p></div></div>' +
                    '</div>' +
                    '<div class="git-commit-detail-section">' +
                        '<div class="git-commit-detail-subhead">Changed files</div>' +
                        '<div class="git-commit-files"><div class="git-loading-state"><i class="fa fa-spinner fa-spin"></i><p>Loading…</p></div></div>' +
                    '</div>'
                );

                $d.find('.git-commit-detail-actions').on('click', '.git-commit-action', function() {
                    runCommitAction($(this).attr('data-act'), commit);
                });
                $d.find('.git-copy-hash').on('click', function(e) { e.stopPropagation(); copyText(commit.hash); });

                loadCommitFlows(commit, base, $d.find('.git-commit-flows'));
                loadCommitFiles(commit, base, $d.find('.git-commit-files'));
                return $d;
            }

            // The per-flow breakdown of what a commit changed. Each unit can be
            // viewed (field diff) or restored into the working tree from this commit.
            function loadCommitFlows(commit, base, $target) {
                $.ajax({
                    url: 'rosepetal-git/flow-diff',
                    type: 'POST',
                    data: JSON.stringify({ base: base, head: commit.hash }),
                    contentType: 'application/json',
                    success: function(diff) {
                        var units = (diff && diff.units ? diff.units : []).filter(function(u) {
                            return u.status !== 'unchanged';
                        });
                        if (!units.length) {
                            $target.html('<div class="git-diff-empty">No flow changes in this commit.</div>');
                            return;
                        }
                        $target.empty().append(buildFlowUnits(units, {
                            base: base,
                            head: commit.hash,
                            revertRef: commit.hash,
                            revertVerb: 'restore',
                            nodeRevertRef: commit.hash
                        }));
                    },
                    error: function() {
                        $target.html('<div class="git-diff-empty">Flow file unavailable for this commit.</div>');
                    }
                });
            }

            function loadCommitFiles(commit, base, $target) {
                $.ajax({
                    url: 'rosepetal-git/commit-diff',
                    type: 'POST',
                    data: JSON.stringify({ commitRef: commit.hash }),
                    contentType: 'application/json',
                    success: function(res) {
                        var files = (res && res.files) || [];
                        if (!files.length) {
                            $target.html('<div class="git-diff-empty">No files changed.</div>');
                            return;
                        }
                        var $fl = $('<div class="git-file-list">');
                        files.forEach(function(f) {
                            var letter = String(f.status || '').charAt(0).toLowerCase();
                            var $f = $('<div class="git-file-row">').html(
                                '<span class="git-file-status git-fs-' + escapeAttr(letter) + '">' + escapeHtml(f.status) + '</span>' +
                                '<span class="git-file-path">' + escapeHtml(f.path) + '</span>'
                            );
                            $f.on('click', function() { openFileDiff(f.path, base, commit.hash); });
                            $fl.append($f);
                        });
                        $target.empty().append($fl);
                    },
                    error: function() {
                        $target.html('<div class="git-diff-empty">Could not load files.</div>');
                    }
                });
            }

            // Show a file's unified text diff between two refs in the diff modal.
            function openFileDiff(file, base, head) {
                $('#git-diff-title').text(file);
                $('#git-diff-body').html('<div class="git-loading-state"><i class="fa fa-spinner fa-spin"></i><p>Loading diff…</p></div>');
                $('#git-diff-modal').fadeIn(150);
                $.ajax({
                    url: 'rosepetal-git/file-diff',
                    type: 'POST',
                    data: JSON.stringify({ file: file, base: base, head: head }),
                    contentType: 'application/json',
                    success: function(res) { $('#git-diff-body').html(renderUnifiedDiff(res.diff)); },
                    error: function() { $('#git-diff-body').html('<p>Failed to load diff.</p>'); }
                });
            }

            function renderUnifiedDiff(diff) {
                if (!diff || !diff.trim()) return '<div class="git-diff-empty">No textual differences.</div>';
                var lines = diff.split('\n').map(function(ln) {
                    var cls = '';
                    if (/^\+\+\+|^---/.test(ln)) cls = 'dl-file';
                    else if (ln.charAt(0) === '+') cls = 'dl-add';
                    else if (ln.charAt(0) === '-') cls = 'dl-del';
                    else if (ln.charAt(0) === '@') cls = 'dl-hunk';
                    return '<div class="git-diff-line ' + cls + '">' + escapeHtml(ln || ' ') + '</div>';
                }).join('');
                return '<div class="git-unified-diff">' + lines + '</div>';
            }

            // Validate first (uncommitted changes would be lost), then check out.
            function checkoutCommit(hash) {
                $.ajax({
                    url: 'rosepetal-git/validate-checkout',
                    type: 'POST',
                    data: JSON.stringify({ targetRef: hash }),
                    contentType: 'application/json',
                    success: function(validation) {
                        if (validation.canCheckout) {
                            executeGitOperation('checkout', { commitRef: hash }, function() {
                                reloadFlowsFromDisk(function() { loadAll(); });
                            });
                        } else {
                            showBlockingError(validation.blockers, validation);
                        }
                    },
                    error: function(xhr) {
                        RED.notify("Failed to validate checkout: " + ((xhr.responseJSON && xhr.responseJSON.error) || "Unknown error"), "error");
                    }
                });
            }

            function runCommitAction(act, commit) {
                var h = commit.hash, short = h.substring(0, 7);
                if (act === 'checkout') {
                    checkoutCommit(h);
                } else if (act === 'branch') {
                    var name = prompt('New branch name (starting at ' + short + '):');
                    if (!name) return;
                    executeGitOperation('create-branch', { name: name, startPoint: h, checkout: true }, function() {
                        reloadFlowsFromDisk(function() { loadAll(); });
                    });
                } else if (act === 'reset-mixed') {
                    if (!confirm('Reset the current branch to ' + short + '?\n\nCommits after it are removed from the branch, but your working files are KEPT as uncommitted changes.')) return;
                    executeGitOperation('reset', { commitRef: h, resetMode: 'mixed' }, function() {
                        reloadFlowsFromDisk(function() { loadAll(); });
                    });
                } else if (act === 'reset-hard') {
                    if (!confirm('⚠ HARD reset to ' + short + '?\n\nThis PERMANENTLY discards every commit after it AND all uncommitted changes. This cannot be undone.')) return;
                    executeGitOperation('reset', { commitRef: h, resetMode: 'hard', safeMode: false }, function() {
                        reloadFlowsFromDisk(function() { loadAll(); });
                    });
                } else if (act === 'revert') {
                    if (!confirm('Create a new commit that undoes ' + short + '?\n\nHistory is preserved — a new commit reverses this one\'s changes.')) return;
                    executeGitOperation('revert', { commitRef: h }, afterPossibleConflict);
                }
            }

            // Follow-up for merge-like ops (pull / revert / cherry-pick) that may
            // leave conflicts. Three outcomes:
            //   - conflicted: flow file has conflict markers (invalid JSON) - do NOT
            //     reload from it; just refresh state so the banner shows.
            //   - changed nothing relevant (result.flowFileChanged === false, e.g. a
            //     no-op "already up to date" pull): refresh the panels only, no
            //     Node-RED restart / page reload.
            //   - otherwise: reload flows from disk (restart) to resync the editor.
            function afterPossibleConflict(result) {
                if (result && result.conflicted) {
                    var n = (result.conflictedFiles || []).length;
                    RED.notify((n || 'Some') + ' file(s) conflicted — resolve them or use Abort on the banner.', "warning");
                    loadAll();
                } else if (result && result.flowFileChanged === false) {
                    loadAll();
                } else {
                    reloadFlowsFromDisk(function() { loadAll(); });
                }
            }

            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(
                        function() { RED.notify("Copied " + text.substring(0, 10) + "…", "success"); },
                        function() { RED.notify("Copy failed", "error"); }
                    );
                    return;
                }
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); RED.notify("Copied", "success"); }
                catch (e) { RED.notify("Copy failed", "error"); }
                document.body.removeChild(ta);
            }

            function loadChanges() {
                $.ajax({
                    url: 'rosepetal-git/status',
                    type: 'POST',
                    data: JSON.stringify({}),
                    contentType: 'application/json',
                    success: function(result) {
                        if (!result.success) return;
                        // Paint the file list immediately, then fetch and inject the
                        // per-flow breakdown asynchronously so the panel feels snappy.
                        renderChanges(result.status);
                        loadFlowBreakdown(result.status);
                    }
                });
            }

            // Fetch the flow file's per-flow breakdown (working tree vs HEAD) and
            // inject it under the flow file's row. Kept separate from renderChanges
            // so the file list never waits on the (heavier) flow diff.
            function loadFlowBreakdown(status) {
                $('.git-flow-units').remove();
                var flowFile = (projectInfo && projectInfo.flowFile) || 'flows.json';
                var flowChanged = status.files && status.files.some(function(f) {
                    return f.path === flowFile;
                });
                if (!flowChanged) return;

                $.ajax({
                    url: 'rosepetal-git/flow-diff',
                    type: 'POST',
                    data: JSON.stringify({ base: 'HEAD' }),
                    contentType: 'application/json',
                    success: function(diff) {
                        var units = (diff && diff.units ? diff.units : []).filter(function(u) {
                            return u.status !== 'unchanged';
                        });
                        injectFlowUnits(flowFile, units);
                    }
                });
            }

            function renderChanges(status) {
                // Single unified list: every changed file appears once. Staging is
                // implicit - Commit stages everything (git add -A) before committing.
                var changedFiles = [];
                if (status.files && Array.isArray(status.files)) {
                    status.files.forEach(function(fileObj) {
                        var isUntracked = fileObj.index === '?' || fileObj.working_dir === '?';
                        // Prefer the working-tree status; fall back to the staged one.
                        var st = isUntracked ? '?'
                            : (fileObj.working_dir !== ' ' ? fileObj.working_dir : fileObj.index);
                        changedFiles.push({ file: fileObj.path, status: st });
                    });
                }

                renderFileList('#git-unstaged-list', changedFiles);
                $('#git-unstaged-count').text(changedFiles.length);
                updateCommitButton(changedFiles.length);
            }

            function renderFileList(containerSelector, files) {
                var $list = $(containerSelector);
                var $section = $('#git-unstaged-section');

                $list.empty();

                if (files.length === 0) {
                    $section.hide();  // Hide section when there are no changes
                    return;
                }

                $section.show();

                files.forEach(function(fileObj) {
                    var statusClass = 'git-status-' + String(fileObj.status).toLowerCase();
                    var $item = $('<div class="git-change-item ' + statusClass + '">');

                    var fileAttr = escapeAttr(fileObj.file);
                    var fileText = escapeHtml(fileObj.file);
                    var statusText = escapeHtml(fileObj.status);

                    $item.html(
                        '<span class="git-change-status">' + statusText + '</span>' +
                        '<span class="git-change-file">' + fileText + '</span>' +
                        '<button class="git-discard-file-btn" data-file="' + fileAttr + '" title="Discard changes">' +
                        '<i class="fa fa-trash-o"></i>' +
                        '</button>'
                    );

                    $item.attr('data-file', fileObj.file);
                    $list.append($item);
                });

                $list.find('.git-discard-file-btn').on('click', function(e) {
                    e.stopPropagation();  // Prevent triggering parent clicks
                    discardFile($(this).data('file'));
                });
            }

            // ---------- Flow-level breakdown of the flow file ----------

            function flowUnitIcon(kind) {
                if (kind === 'subflow') return 'fa-clone';
                if (kind === 'config') return 'fa-cog';
                return 'fa-share-alt';
            }

            function flowUnitCounts(unit) {
                if (unit.status === 'added') return '<span class="add">new</span>';
                if (unit.status === 'removed') return '<span class="del">deleted</span>';
                var parts = [];
                if (unit.counts.added) parts.push('<span class="add">+' + unit.counts.added + '</span>');
                if (unit.counts.modified) parts.push('<span class="mod">~' + unit.counts.modified + '</span>');
                if (unit.counts.removed) parts.push('<span class="del">-' + unit.counts.removed + '</span>');
                return parts.join(' ');
            }

            // Dot colour reflects the nature of the change, not just the unit
            // status: a whole new/removed flow is green/red, and so is a flow that
            // only gained or only lost nodes; mixed edits stay orange (modified).
            function flowUnitTone(unit) {
                if (unit.status === 'added') return 'added';
                if (unit.status === 'removed') return 'removed';
                var c = unit.counts || {};
                if (c.added && !c.modified && !c.removed) return 'added';
                if (c.removed && !c.modified && !c.added) return 'removed';
                return 'modified';
            }

            // Render a list of flow units. `ctx` decides what the view/revert
            // buttons compare against and restore to, so the same rows serve both
            // the working-changes panel (vs HEAD) and a past commit's detail.
            function buildFlowUnits(units, ctx) {
                ctx = ctx || { base: 'HEAD', head: null, revertRef: 'HEAD', revertVerb: 'revert', nodeRevertRef: 'HEAD' };
                var restore = ctx.revertVerb === 'restore';
                var revertTitle = restore ? 'Restore this unit from this commit' : 'Revert this unit to the last commit';
                var revertIcon = restore ? 'fa-history' : 'fa-undo';

                var $wrap = $('<div class="git-flow-units">');
                units.forEach(function(unit) {
                    var $row = $('<div class="git-flow-unit git-flow-status-' + unit.status + '">');
                    $row.html(
                        '<span class="git-flow-unit-status git-dot-' + flowUnitTone(unit) + '"></span>' +
                        '<span class="git-flow-unit-icon"><i class="fa ' + flowUnitIcon(unit.kind) + '"></i></span>' +
                        '<span class="git-flow-unit-label">' + escapeHtml(unit.label) + '</span>' +
                        '<span class="git-flow-unit-counts">' + flowUnitCounts(unit) + '</span>' +
                        '<button class="git-flow-unit-btn git-flow-unit-diff" title="View changes"><i class="fa fa-eye"></i></button>' +
                        '<button class="git-flow-unit-btn git-flow-unit-revert" title="' + escapeAttr(revertTitle) + '"><i class="fa ' + revertIcon + '"></i></button>'
                    );
                    $row.find('.git-flow-unit-diff').on('click', function() {
                        openUnitDiff(unit.id, unit.label, ctx);
                    });
                    $row.find('.git-flow-unit-revert').on('click', function() {
                        revertFlowUnit(unit.id, unit.label, ctx.revertRef, ctx.revertVerb);
                    });
                    $wrap.append($row);
                });

                return $wrap;
            }

            function findChangeRow(listSelector, file) {
                return $(listSelector + ' .git-change-item').filter(function() {
                    return $(this).data('file') === file;
                }).first();
            }

            // Insert the per-flow rows right beneath the flow file's row.
            function injectFlowUnits(flowFile, units) {
                if (!units || !units.length) return;
                var $row = findChangeRow('#git-unstaged-list', flowFile);
                if (!$row.length) return;
                $row.after(buildFlowUnits(units));
            }

            // Field-level diff for one unit, between ctx.base and ctx.head (working
            // tree when ctx.head is empty). Remembers which ref a per-node revert
            // inside the modal should target.
            function openUnitDiff(unitId, label, ctx) {
                ctx = ctx || {};
                currentDiffCtx = { ref: ctx.nodeRevertRef || 'HEAD', verb: ctx.revertVerb || 'revert' };

                $('#git-diff-title').text('Changes · ' + label);
                $('#git-diff-body').html('<div class="git-loading-state"><i class="fa fa-spinner fa-spin"></i><p>Loading changes…</p></div>');
                $('#git-diff-modal').fadeIn(150);

                var payload = { base: ctx.base || 'HEAD', detail: true };
                if (ctx.head) payload.head = ctx.head;

                $.ajax({
                    url: 'rosepetal-git/flow-diff',
                    type: 'POST',
                    data: JSON.stringify(payload),
                    contentType: 'application/json',
                    success: function(diff) {
                        var unit = (diff.units || []).filter(function(u) { return u.id === unitId; })[0];
                        $('#git-diff-body').html(renderUnitDiffHtml(unit));
                    },
                    error: function() {
                        $('#git-diff-body').html('<p>Failed to load changes.</p>');
                    }
                });
            }

            // Structural keys describe placement, not configuration; hidden in field diffs.
            var DIFF_SKIP_KEYS = { id: 1, type: 1, z: 1, g: 1, x: 1, y: 1, wires: 1 };

            function renderUnitDiffHtml(unit) {
                if (!unit) return '<p>No changes.</p>';
                var html = '';

                if (unit.added && unit.added.length) {
                    html += '<div class="git-diff-unit-section"><strong>Added (' + unit.added.length + ')</strong>';
                    unit.added.forEach(function(n) { html += nodeBlockHtml(n, 'added', fieldsForSide(n, 'to')); });
                    html += '</div>';
                }
                if (unit.removed && unit.removed.length) {
                    html += '<div class="git-diff-unit-section"><strong>Removed (' + unit.removed.length + ')</strong>';
                    unit.removed.forEach(function(n) { html += nodeBlockHtml(n, 'removed', fieldsForSide(n, 'from')); });
                    html += '</div>';
                }
                if (unit.modified && unit.modified.length) {
                    html += '<div class="git-diff-unit-section"><strong>Modified (' + unit.modified.length + ')</strong>';
                    unit.modified.forEach(function(m) {
                        html += nodeBlockHtml(m.head || {}, 'modified', diffNodeFields(m.base || {}, m.head || {}), m.id);
                    });
                    html += '</div>';
                }

                return html || '<p>No changes.</p>';
            }

            // Field rows for a whole added/removed node: every config field on one
            // side. `side` is 'to' (added, green) or 'from' (removed, struck red).
            function fieldsForSide(node, side) {
                return Object.keys(node)
                    .filter(function(k) { return !DIFF_SKIP_KEYS[k]; })
                    .map(function(k) {
                        var v = stringifyVal(node[k]);
                        return side === 'to' ? { key: k, from: '', to: v } : { key: k, from: v, to: '' };
                    });
            }

            function fieldRowsHtml(fields) {
                if (!fields.length) {
                    return '<div class="git-diff-empty">(no field-level changes)</div>';
                }
                var header = '<div class="git-diff-cols-header">' +
                    '<span>Field</span><span>Before</span><span>After</span></div>';
                var rows = fields.map(function(f) {
                    return '<div class="git-diff-field">' +
                        '<span class="git-diff-field-key">' + escapeHtml(f.key) + '</span>' +
                        '<span class="git-diff-col git-diff-col-before">' + (f.from ? escapeHtml(f.from) : '') + '</span>' +
                        '<span class="git-diff-col git-diff-col-after">' + (f.to ? escapeHtml(f.to) : '') + '</span>' +
                        '</div>';
                }).join('');
                return header + rows;
            }

            // One collapsible node block: a clickable header (with a per-node
            // revert button) plus its field detail.
            function nodeBlockHtml(node, tone, fields, idOverride) {
                var fullId = idOverride || node.id || '';
                var name = node.name || node.label || '';
                var icon = tone === 'added' ? 'fa-plus' : (tone === 'removed' ? 'fa-minus' : 'fa-pencil');
                var title = tone === 'added' ? 'Remove this added node'
                    : (tone === 'removed' ? 'Restore this node from the last commit'
                    : 'Revert this node to the last commit');
                return '<div class="git-diff-node git-diff-node-' + tone + '">' +
                    '<div class="git-diff-node-head">' +
                        '<i class="fa fa-chevron-right git-diff-node-chevron"></i>' +
                        '<i class="fa ' + icon + '"></i>' +
                        '<span class="git-diff-node-type">' + escapeHtml(node.type || '') + '</span>' +
                        (name ? '<span>' + escapeHtml(name) + '</span>' : '') +
                        '<span class="git-diff-node-id">' + escapeHtml(fullId.substring(0, 8)) + '</span>' +
                        '<button class="git-diff-node-revert" data-node-id="' + escapeAttr(fullId) + '" title="' + escapeAttr(title) + '"><i class="fa fa-undo"></i></button>' +
                    '</div>' +
                    '<div class="git-diff-node-body">' + fieldRowsHtml(fields) + '</div>' +
                '</div>';
            }

            function stringifyVal(v) {
                if (v === undefined) return '(none)';
                if (typeof v === 'string') return v;
                var s = JSON.stringify(v);
                return s && s.length > 200 ? s.substring(0, 200) + '…' : s;
            }

            // Top-level keys that differ between two node versions, for a readable
            // field-level diff (full deep diff would be noisy for big nodes).
            function diffNodeFields(base, head) {
                var keys = {};
                Object.keys(base).forEach(function(k) { keys[k] = true; });
                Object.keys(head).forEach(function(k) { keys[k] = true; });
                var out = [];
                Object.keys(keys).forEach(function(k) {
                    if (JSON.stringify(base[k]) !== JSON.stringify(head[k])) {
                        out.push({ key: k, from: stringifyVal(base[k]), to: stringifyVal(head[k]) });
                    }
                });
                return out;
            }

            // A short label for the ref a revert targets, for confirm prompts.
            function refLabel(ref) {
                return (!ref || ref === 'HEAD') ? 'the last commit' : 'commit ' + ref.substring(0, 7);
            }

            function revertFlowNode(nodeId) {
                if (!nodeId) return;
                var ref = currentDiffCtx.ref || 'HEAD';
                if (!confirm('Restore this node to its version at ' + refLabel(ref) + '?\n\nOnly this node changes; everything else in the flow stays as-is.')) {
                    return;
                }
                $.ajax({
                    url: 'rosepetal-git/revert-flow-nodes',
                    type: 'POST',
                    data: JSON.stringify({ nodeIds: [nodeId], ref: ref }),
                    contentType: 'application/json',
                    success: function(res) {
                        if (res.warning) RED.notify(res.warning, "warning");
                        RED.notify("Node restored", "success");
                        $('#git-diff-modal').fadeOut(150);
                        reloadFlowsFromDisk(function() { loadAll(); });
                    },
                    error: function(xhr) {
                        var info = xhr.responseJSON || {};
                        RED.notify("Failed to restore node: " + (info.error || "Unknown error"), "error");
                    }
                });
            }

            function revertFlowUnit(unitId, label, ref, verb) {
                ref = ref || 'HEAD';
                var restore = verb === 'restore';
                var msg = restore
                    ? 'Restore "' + label + '" to ' + refLabel(ref) + '?\n\nThis brings the unit back to how it was in ' + refLabel(ref) + ', as an uncommitted change. Other flows are untouched.'
                    : 'Revert "' + label + '" to ' + refLabel(ref) + '?\n\nThis discards uncommitted changes to this unit only. Other flows are left untouched.';
                if (!confirm(msg)) {
                    return;
                }
                $.ajax({
                    url: 'rosepetal-git/revert-flow-unit',
                    type: 'POST',
                    data: JSON.stringify({ unitId: unitId, ref: ref }),
                    contentType: 'application/json',
                    success: function(res) {
                        if (res.warning) RED.notify(res.warning, "warning");
                        RED.notify((restore ? 'Restored "' : 'Reverted "') + label + '"', "success");
                        reloadFlowsFromDisk(function() { loadAll(); });
                    },
                    error: function(xhr) {
                        var info = xhr.responseJSON || {};
                        RED.notify("Failed: " + (info.error || "Unknown error"), "error");
                    }
                });
            }

            function discardFile(file) {
                if (!confirm('WARNING: Discard changes to "' + file + '"?\n\nThis will permanently delete your uncommitted changes. This cannot be undone!')) {
                    return;
                }

                $.ajax({
                    url: 'rosepetal-git/discard',
                    type: 'POST',
                    data: JSON.stringify({ files: [file] }),
                    contentType: 'application/json',
                    success: function() {
                        RED.notify("Changes discarded: " + file, "success");
                        // Reload flows from disk after discarding changes
                        reloadFlowsFromDisk(function() {
                            loadAll();
                        });
                    },
                    error: function(xhr) {
                        // Show the real git reason + suggestion (e.g. unmerged path),
                        // not just a generic "discard failed".
                        displayDetailedError(xhr.responseJSON || {}, 'discard');
                    }
                });
            }

            function updateCommitButton(changeCount) {
                var $commitPanel = $('#git-commit-panel');
                var $commitBtn = $('#git-btn-commit');

                $commitBtn.prop('disabled', changeCount === 0);

                if (changeCount === 0) {
                    $commitPanel.hide();  // Hide when there's nothing to commit
                } else {
                    $commitPanel.show();  // Show whenever there are changes
                }
            }

            function showBlockingError(blockers, validation) {
                var messages = [];
                var actions = [];

                if (blockers.includes('uncommitted_changes')) {
                    messages.push('<p><i class="fa fa-file-o"></i> You have <strong>' + validation.uncommittedCount + ' uncommitted change(s)</strong>.</p>');
                    messages.push('<p class="git-blocking-hint">Please commit or discard your changes first.</p>');
                    actions.push('<button class="git-action-btn git-action-danger" id="git-discard-all-action"><i class="fa fa-trash-o"></i><span>Discard All Changes</span></button>');
                }

                if (blockers.includes('unpushed_commits')) {
                    messages.push('<p><i class="fa fa-cloud-upload"></i> You have <strong>' + validation.unpushedCount + ' unpushed commit(s)</strong>.</p>');
                    messages.push('<p class="git-blocking-hint">Please push your commits first.</p>');
                    actions.push('<button class="git-action-btn git-action-primary" id="git-push-now-action"><i class="fa fa-upload"></i><span>Push Now</span></button>');
                }

                $('#git-blocking-message').html(messages.join(''));
                $('#git-blocking-actions').html(actions.join('') + '<button class="git-action-btn" id="git-cancel-action"><i class="fa fa-times"></i><span>Cancel</span></button>');

                $('#git-blocking-modal').fadeIn(200);

                // Attach action handlers
                $('#git-discard-all-action').on('click', function() {
                    $('#git-blocking-modal').fadeOut(200);
                    handleDiscardChanges();
                });

                $('#git-push-now-action').on('click', function() {
                    $('#git-blocking-modal').fadeOut(200);
                    handlePush();
                });

                $('#git-cancel-action').on('click', function() {
                    $('#git-blocking-modal').fadeOut(200);
                });
            }

            function handleFetch() {
                setToolbarLoading('#git-btn-fetch', true);
                executeGitOperation('fetch', {}, function() {
                    setToolbarLoading('#git-btn-fetch', false);
                    loadAll();
                }, function() {
                    setToolbarLoading('#git-btn-fetch', false);
                });
            }

            function handlePull() {
                setToolbarLoading('#git-btn-pull', true);
                executeGitOperation('pull', {}, function(result) {
                    setToolbarLoading('#git-btn-pull', false);
                    afterPossibleConflict(result);
                }, function() {
                    setToolbarLoading('#git-btn-pull', false);
                });
            }

            function handlePush() {
                if (!projectInfo) {
                    RED.notify("Project info not loaded yet", "warning");
                    return;
                }

                var hasTracking = projectInfo.hasTracking;
                var ahead = projectInfo.ahead || 0;

                if (hasTracking && ahead === 0) {
                    RED.notify("No commits to push", "warning");
                    return;
                }

                // Normal push (commits in detached HEAD now create branches automatically)
                setToolbarLoading('#git-btn-push', true);
                executeGitOperation('push', {}, function() {
                    setToolbarLoading('#git-btn-push', false);
                    loadAll();
                }, function(errMsg) {
                    setToolbarLoading('#git-btn-push', false);
                    // A diverged/non-fast-forward rejection is recoverable: offer a
                    // force-push (the plain error toast already explained the cause).
                    if (/non-fast-forward|diverged|rejected|fetch first/i.test(errMsg || '')) {
                        offerForcePush();
                    }
                });
            }

            // Confirm-gated force push for a diverged branch. --force-with-lease is
            // refused if the remote has commits we haven't seen, so it won't silently
            // clobber someone else's work the way a plain --force would.
            function offerForcePush() {
                if (!confirm('Remote and local have diverged.\n\nForce-push with --force-with-lease? This replaces the remote branch with yours. It is refused if the remote has commits you have not fetched, so it is safer than a plain force-push — but it still overwrites remote history.\n\nCancel instead to Pull and merge first.')) {
                    return;
                }
                setToolbarLoading('#git-btn-push', true);
                executeGitOperation('force-push', { confirmed: true }, function() {
                    setToolbarLoading('#git-btn-push', false);
                    loadAll();
                }, function() {
                    setToolbarLoading('#git-btn-push', false);
                });
            }

            function handleBranchSwitch() {
                var branch = $('#git-branch-selector').val();
                if (branch && branch !== currentBranch) {
                    executeGitOperation('checkout', { commitRef: branch }, function() {
                        currentBranch = branch;
                        // Reload flows from disk after branch switch
                        reloadFlowsFromDisk(function() {
                            loadAll();
                        });
                    });
                }
            }

            function handleCommit() {
                var message = $('#git-commit-message').val().trim();

                if (!message) {
                    RED.notify("Commit message is required", "warning");
                    return;
                }

                // Check if in detached HEAD state - show info about branch creation
                if (projectInfo && projectInfo.isDetachedHead) {
                    var warningMsg = 'ℹ️ Committing in Detached HEAD\n\n' +
                        'You are creating a commit from an old state.\n\n' +
                        'A new branch will be created automatically:\n' +
                        '  • Branch name: from-<commit-hash>\n' +
                        '  • Your changes will be on this new branch\n' +
                        '  • You can merge or push this branch later\n\n' +
                        'Do you want to continue?';

                    if (!confirm(warningMsg)) {
                        return;
                    }
                }

                var $btn = $('#git-btn-commit');
                $btn.prop('disabled', true).find('i').addClass('fa-spin');

                // Create commit with already-staged files
                $.ajax({
                    url: 'rosepetal-git/commit',
                    type: 'POST',
                    data: JSON.stringify({ message: message, stageAll: true }),
                    contentType: 'application/json',
                    success: function(commitResult) {
                        if (commitResult.success) {
                            if (commitResult.createdBranch && commitResult.branch) {
                                RED.notify("Commit created on new branch '" + commitResult.branch + "'", "success");
                            } else {
                                RED.notify("Commit created successfully", "success");
                            }

                            if (commitResult.warning) {
                                RED.notify(commitResult.warning, "warning");
                            }

                            $('#git-commit-message').val('');
                            loadAll();
                        }
                        $btn.prop('disabled', false).find('i').removeClass('fa-spin');
                    },
                    error: function(xhr) {
                        var errorInfo = xhr.responseJSON || {};
                        if (errorInfo.error || errorInfo.suggestion) {
                            displayDetailedError(errorInfo, 'commit');
                        } else {
                            RED.notify("Commit failed: " + (errorInfo.error || "Unknown error"), "error");
                        }
                        $btn.prop('disabled', false).find('i').removeClass('fa-spin');
                    }
                });
            }

            function handleDiscardChanges() {
                if (!confirm('WARNING: This will permanently discard ALL uncommitted changes. This action cannot be undone. Are you sure?')) {
                    return;
                }

                // Use reset --hard HEAD to discard all changes
                executeGitOperation('reset', {
                    commitRef: 'HEAD',
                    resetMode: 'hard',
                    safeMode: false
                }, function() {
                    // Reload flows from disk after discarding changes
                    reloadFlowsFromDisk(function() {
                        loadAll();
                    });
                });
            }

            function setToolbarLoading(selector, loading) {
                var $btn = $(selector);
                if (loading) {
                    $btn.prop('disabled', true).find('i').addClass('fa-spin');
                } else {
                    $btn.prop('disabled', false).find('i').removeClass('fa-spin');
                }
            }

            function displayDetailedError(errorInfo, operation) {
                // Create detailed error message
                var message = errorInfo.error || "Git " + operation + " failed";

                // Add suggestion if available
                if (errorInfo.suggestion) {
                    message += "\n\n" + errorInfo.suggestion;
                }

                // Display main error notification
                RED.notify(message, "error");

                // Log details to console for debugging
                if (errorInfo.details) {
                    console.error("Git Error Details:", errorInfo.details);
                }
            }

            function executeGitOperation(operation, data, successCallback, errorCallback) {
                data = data || {};

                $.ajax({
                    url: 'rosepetal-git/' + operation,
                    type: 'POST',
                    data: JSON.stringify(data),
                    contentType: 'application/json',
                    success: function(result) {
                        if (result.success) {
                            RED.notify("Git " + operation + " completed", "success");
                            if (successCallback) successCallback(result);
                        }
                    },
                    error: function(xhr) {
                        var errorInfo = xhr.responseJSON || {};

                        // Use detailed error if available, otherwise fallback to simple message
                        if (errorInfo.error || errorInfo.suggestion) {
                            displayDetailedError(errorInfo, operation);
                        } else {
                            var simpleError = errorInfo.error || "Unknown error";
                            RED.notify("Git " + operation + " failed: " + simpleError, "error");
                        }

                        if (errorCallback) errorCallback(errorInfo.error || "Unknown error");
                    }
                });
            }

            // After a git operation changes the flow file on disk, ask the
            // Node-RED runtime to reload flows from storage. The "reload"
            // deployment type re-reads the flow file from disk and ignores the
            // request body (so we don't have to read+re-POST the whole flow
            // set). The runtime holds the old flows in memory until this runs,
            // so we reload the editor afterwards to resync the workspace.
            function reloadFlowsFromDisk(callback) {
                $.ajax({
                    url: 'flows',
                    type: 'POST',
                    headers: { 'Node-RED-Deployment-Type': 'reload' },
                    data: JSON.stringify({}),
                    contentType: 'application/json',
                    success: function() {
                        // The runtime has finished reloading by the time this fires;
                        // a short delay just lets the toast paint before reload.
                        RED.notify("Flows reloaded from disk. Refreshing editor…", "success");
                        setTimeout(function() {
                            window.location.reload();
                        }, 250);
                    },
                    error: function(xhr) {
                        var info = xhr.responseJSON || {};
                        var error = info.message || info.error || "Unknown error";
                        RED.notify("Failed to reload flows: " + error, "error");
                        if (callback) callback();
                    }
                });
            }

            function getRelativeTime(dateString) {
                var date = new Date(dateString);
                var now = new Date();
                var seconds = Math.floor((now - date) / 1000);

                if (seconds < 60) return seconds + ' seconds ago';
                if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
                if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
                if (seconds < 2592000) return Math.floor(seconds / 86400) + ' days ago';
                if (seconds < 31536000) return Math.floor(seconds / 2592000) + ' months ago';
                return Math.floor(seconds / 31536000) + ' years ago';
            }
        }
    });
})();
</script>
