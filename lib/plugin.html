<style type="text/css">
/* Git Control Panel - Modern VS Code Style */

.git-control-panel {
    padding: 0;
    overflow: hidden;
    background-color: var(--red-ui-secondary-background, #fff);
    width: 100%;
    box-sizing: border-box;
}

.git-control-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow-y: auto;
    box-sizing: border-box;
}

/* ==================== Toolbar ==================== */

.git-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    border-bottom: 1px solid var(--red-ui-primary-border-color, #ddd);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 48px;
}

.git-toolbar-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    color: var(--red-ui-text-color-heading, #333);
    flex: 0 1 auto;
    min-width: 0;
}

.git-toolbar-title i {
    color: #f05033;
    font-size: 16px;
}

.git-toolbar-actions {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
}

.git-toolbar-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color, #333);
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.15s ease;
}

.git-toolbar-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-toolbar-btn:active {
    transform: scale(0.95);
}

.git-toolbar-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.git-sync-indicator {
    position: absolute;
    top: 2px;
    right: 2px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    background-color: #ff6b6b;
    color: white;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    display: none;
    align-items: center;
    justify-content: center;
}

/* ==================== Branch Section ==================== */

.git-branch-section {
    padding: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
}

.git-branch-current {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--red-ui-text-color, #333);
    font-weight: 500;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}

.git-branch-current i {
    color: #4285f4;
}

.git-branch-selector {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    font-size: 12px;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
    cursor: pointer;
}

.git-branch-selector:focus {
    outline: none;
    border-color: #4285f4;
}

/* ==================== Changes Section ==================== */

.git-changes-section {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
}

.git-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    user-select: none;
}

.git-section-header:hover {
    background-color: var(--red-ui-secondary-background-hover, #e8e8e8);
}

.git-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    background-color: #e0e0e0;
    color: #333;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
}

.git-changes-list {
    max-height: 200px;
    overflow-y: auto;
}

.git-change-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.git-change-item:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-change-status {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    font-weight: 600;
    font-size: 10px;
}

.git-status-m .git-change-status {
    background-color: #fff3e0;
    color: #e65100;
}

.git-status-a .git-change-status {
    background-color: #e8f5e9;
    color: #2e7d32;
}

.git-status-d .git-change-status {
    background-color: #ffebee;
    color: #c62828;
}

.git-status-u .git-change-status {
    background-color: #f3e5f5;
    color: #6a1b9a;
}

.git-change-file {
    flex: 1;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    word-break: break-all;
}

/* Discard file button */
.git-discard-file-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #999);
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-size: 12px;
    margin-left: auto;
}

.git-discard-file-btn:hover {
    background-color: #ffebee;
    color: #c62828;
}

.git-discard-file-btn:active {
    transform: scale(0.9);
}

/* ==================== Flow-level breakdown ==================== */

.git-flow-units {
    border-top: 1px dashed var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background-inactive, #fafafa);
}

.git-flow-unit {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 26px;
    font-size: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #efefef);
}

.git-flow-unit:last-child { border-bottom: none; }

.git-flow-unit:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-flow-unit-status {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #999;
}

.git-flow-unit-status.git-dot-added { background: #2e7d32; }
.git-flow-unit-status.git-dot-modified { background: #e65100; }
.git-flow-unit-status.git-dot-removed { background: #c62828; }

.git-flow-unit-icon {
    width: 14px;
    text-align: center;
    color: var(--red-ui-text-color-secondary, #888);
    flex-shrink: 0;
}

.git-flow-unit-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--red-ui-text-color, #333);
}

.git-flow-unit-counts {
    font-family: monospace;
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #888);
    flex-shrink: 0;
}

.git-flow-unit-counts .add { color: #2e7d32; }
.git-flow-unit-counts .mod { color: #e65100; }
.git-flow-unit-counts .del { color: #c62828; }

.git-flow-unit-btn {
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
}

.git-flow-unit-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
    color: var(--red-ui-text-color, #333);
}

/* Flow diff modal body */
.git-diff-unit-section { margin-bottom: 14px; }

.git-diff-unit-section > strong {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    margin-bottom: 6px;
}

.git-diff-node {
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    border-radius: 4px;
    margin-bottom: 8px;
    overflow: hidden;
}

.git-diff-node-head {
    padding: 6px 10px;
    background: var(--red-ui-secondary-background-inactive, #f5f5f5);
    font-size: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--red-ui-text-color, #333);
}

.git-diff-node-type {
    font-family: monospace;
    color: var(--red-ui-text-color-secondary, #666);
}

.git-diff-node-id {
    margin-left: auto;
    font-family: monospace;
    color: var(--red-ui-text-color-subdued, #999);
}

/* The diff modal is wider/taller than the action modals */
#git-diff-modal .git-modal-content {
    max-width: 860px;
    width: 92%;
    max-height: 88vh;
}

/* Two-column (Before / After) field diff */
.git-diff-cols-header,
.git-diff-field {
    display: grid;
    grid-template-columns: 120px 1fr 1fr;
    font-family: monospace;
    font-size: 11px;
    border-top: 1px solid var(--red-ui-secondary-border-color, #f0f0f0);
}

.git-diff-cols-header {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--red-ui-text-color-secondary, #999);
    background: var(--red-ui-secondary-background-inactive, #f5f5f5);
}

.git-diff-cols-header > span { padding: 4px 8px; }

.git-diff-field-key {
    padding: 4px 8px;
    color: var(--red-ui-text-color-secondary, #888);
    word-break: break-all;
}

.git-diff-col {
    padding: 4px 8px;
    white-space: pre-wrap;
    word-break: break-all;
    border-left: 1px solid var(--red-ui-secondary-border-color, #f0f0f0);
}

.git-diff-col-before { background: rgba(198, 40, 40, 0.09); color: #c62828; }
.git-diff-col-after { background: rgba(46, 125, 50, 0.11); color: #2e7d32; }

.git-diff-empty { padding: 6px 10px; font-size: 11px; color: var(--red-ui-text-color-secondary, #999); }

/* Collapsible per-node detail in the diff modal */
.git-diff-node-head { cursor: pointer; user-select: none; }
.git-diff-node-head:hover { background: var(--red-ui-secondary-background-hover, #ececec); }
.git-diff-node-chevron { transition: transform 0.15s ease; color: var(--red-ui-text-color-secondary, #999); font-size: 10px; width: 10px; }
.git-diff-node.open .git-diff-node-chevron { transform: rotate(90deg); }
.git-diff-node-body { display: none; }
.git-diff-node.open .git-diff-node-body { display: block; }
.git-diff-node-added .fa-plus { color: #2e7d32; }
.git-diff-node-removed .fa-minus { color: #c62828; }
.git-diff-node-modified .fa-pencil { color: #e65100; }

.git-diff-node-revert {
    margin-left: 6px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
}
.git-diff-node-revert:hover {
    background: var(--red-ui-secondary-background-hover, #e0e0e0);
    color: var(--red-ui-text-color, #333);
}

/* ==================== Commit Panel ==================== */

.git-commit-panel {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
}

.git-commit-form {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.git-commit-message {
    width: 100%;
    min-height: 50px;
    padding: 6px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
    resize: vertical;
    transition: border-color 0.15s ease;
    box-sizing: border-box;
}

.git-commit-message:focus {
    outline: none;
    border-color: #4285f4;
}

.git-commit-message::placeholder {
    color: #999;
}

.git-primary-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 12px;
    border: none;
    background-color: #4285f4;
    color: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    width: 100%;
}

.git-primary-btn:hover {
    background-color: #3367d6;
    box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
}

.git-primary-btn:active {
    transform: scale(0.98);
}

.git-primary-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background-color: #999;
}

.git-primary-btn i {
    font-size: 14px;
}

/* ==================== Commits Section ==================== */

.git-commits-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* Graph Legend */
.git-graph-legend {
    display: flex;
    gap: 15px;
    margin-left: auto;
    margin-right: 10px;
    font-size: 11px;
    color: var(--red-ui-text-color-subdued, #666);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.legend-dot.pushed {
    background-color: #4A90E2;
}

.legend-dot.unpushed {
    background-color: #9B59B6;
}

.legend-dot.head {
    background-color: #27AE60;
}

/* Graph Container */
.git-graph-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 200px;
    position: relative;
    background-color: #f6f8fa;
    width: 100%;
    box-sizing: border-box;
}

#git-graph-canvas {
    display: block;
    width: 100%;
    box-sizing: border-box;
}

/* Graph Tooltip */
.git-graph-tooltip {
    position: absolute;
    background-color: rgba(0, 0, 0, 0.9);
    color: white;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    max-width: 300px;
    word-wrap: break-word;
    pointer-events: none;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.git-graph-tooltip strong {
    font-family: monospace;
    color: #4A90E2;
}

/* Legacy commit list styles */
.git-commits-list {
    flex: 1;
    overflow-y: auto;
    min-height: 200px;
}

.git-commit-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.git-commit-item:hover {
    background-color: var(--red-ui-secondary-background-hover, #f5f5f5);
}

.git-commit-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}

.git-commit-hash {
    font-family: monospace;
    font-size: 11px;
    color: #666;
    background-color: #f0f0f0;
    padding: 2px 6px;
    border-radius: 3px;
}

.git-commit-time {
    font-size: 11px;
    color: #999;
}

.git-commit-message {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
    color: var(--red-ui-text-color, #333);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.git-commit-author {
    font-size: 11px;
    color: #666;
}

/* ==================== Empty & Loading States ==================== */

.git-empty-state,
.git-loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    text-align: center;
    color: #999;
}

.git-empty-state i,
.git-loading-state i {
    font-size: 18px;
    margin-bottom: 4px;
    opacity: 0.5;
}

.git-empty-state p,
.git-loading-state p {
    margin: 0;
    font-size: 12px;
}

.git-empty-state i {
    color: #4caf50;
}

/* ==================== Modal ==================== */

.git-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.git-modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
}

.git-modal-content {
    position: relative;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    background-color: var(--red-ui-primary-background, #fff);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.git-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
}

.git-modal-header h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--red-ui-text-color-heading, #333);
}

.git-modal-close {
    width: 32px;
    height: 32px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease;
}

.git-modal-close:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.git-commit-details {
    padding: 16px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    border-radius: 4px;
    margin-bottom: 16px;
}

.git-commit-detail-item {
    margin-bottom: 8px;
    font-size: 13px;
    word-break: break-all;
}

.git-commit-detail-item:last-child {
    margin-bottom: 0;
}

.git-commit-detail-item strong {
    display: inline-block;
    min-width: 80px;
    color: var(--red-ui-text-color-secondary, #666);
}

.git-modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.git-action-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
    color: var(--red-ui-text-color, #333);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
}

.git-action-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
    border-color: #4285f4;
}

.git-action-btn i {
    width: 16px;
    text-align: center;
    color: #4285f4;
}

.git-action-btn.git-action-danger {
    border-color: #ffcdd2;
    background-color: #ffebee;
}

.git-action-btn.git-action-danger:hover {
    background-color: #ffcdd2;
    border-color: #ef5350;
}

.git-action-btn.git-action-danger i {
    color: #c62828;
}

/* ==================== Utility Buttons ==================== */

.git-btn-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    border-radius: 3px;
    transition: background-color 0.15s ease;
}

.git-btn-icon:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-discard-btn {
    margin-left: auto;
    color: #c62828 !important;
}

.git-discard-btn:hover {
    background-color: #ffebee !important;
}

/* ==================== Scrollbar Styling ==================== */

.git-commits-list::-webkit-scrollbar,
.git-changes-list::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.git-commits-list::-webkit-scrollbar-track,
.git-changes-list::-webkit-scrollbar-track {
    background: transparent;
}

.git-commits-list::-webkit-scrollbar-thumb,
.git-changes-list::-webkit-scrollbar-thumb {
    background: var(--red-ui-secondary-border-color, #ccc);
    border-radius: 4px;
}

.git-commits-list::-webkit-scrollbar-thumb:hover,
.git-changes-list::-webkit-scrollbar-thumb:hover {
    background: var(--red-ui-secondary-border-color-hover, #999);
}

/* ==================== Dark Mode Support ==================== */

body.red-ui-theme-midnight .git-toolbar {
    background-color: #2d2d2d;
    border-color: #444;
}

body.red-ui-theme-midnight .git-toolbar-title,
body.red-ui-theme-midnight .git-commit-message,
body.red-ui-theme-midnight .git-modal-header h4 {
    color: #ddd;
}

body.red-ui-theme-midnight .git-toolbar-btn,
