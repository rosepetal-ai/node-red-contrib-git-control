<style type="text/css">
/* Git Control Panel - Modern VS Code Style */

.git-control-panel {
    padding: 0;
    overflow: hidden;
    background-color: var(--red-ui-secondary-background, #fff);
    width: 100%;
    box-sizing: border-box;
}

.git-control-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow-y: auto;
    box-sizing: border-box;
}

/* ==================== Toolbar ==================== */

.git-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    border-bottom: 1px solid var(--red-ui-primary-border-color, #ddd);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 48px;
}

.git-toolbar-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    color: var(--red-ui-text-color-heading, #333);
    flex: 0 1 auto;
    min-width: 0;
}

.git-toolbar-title i {
    color: #f05033;
    font-size: 16px;
}

.git-toolbar-actions {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
}

.git-toolbar-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color, #333);
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.15s ease;
}

.git-toolbar-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-toolbar-btn:active {
    transform: scale(0.95);
}

.git-toolbar-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.git-sync-indicator {
    position: absolute;
    top: 2px;
    right: 2px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    background-color: #ff6b6b;
    color: white;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    display: none;
    align-items: center;
    justify-content: center;
}

/* ==================== Branch Section ==================== */

.git-branch-section {
    padding: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
}

.git-branch-current {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--red-ui-text-color, #333);
    font-weight: 500;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}

.git-branch-current i {
    color: #4285f4;
}

.git-branch-selector {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    font-size: 12px;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
    cursor: pointer;
}

.git-branch-selector:focus {
    outline: none;
    border-color: #4285f4;
}

/* ==================== Changes Section ==================== */

.git-changes-section {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
}

.git-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    user-select: none;
}

.git-section-header:hover {
    background-color: var(--red-ui-secondary-background-hover, #e8e8e8);
}

.git-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    background-color: #e0e0e0;
    color: #333;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
}

.git-changes-list {
    max-height: 200px;
    overflow-y: auto;
}

.git-change-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.git-change-item:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-change-status {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    font-weight: 600;
    font-size: 10px;
}

.git-status-m .git-change-status {
    background-color: #fff3e0;
    color: #e65100;
}

.git-status-a .git-change-status {
    background-color: #e8f5e9;
    color: #2e7d32;
}

.git-status-d .git-change-status {
    background-color: #ffebee;
    color: #c62828;
}

.git-status-u .git-change-status {
    background-color: #f3e5f5;
    color: #6a1b9a;
}

.git-change-file {
    flex: 1;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    word-break: break-all;
}

/* Discard file button */
.git-discard-file-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #999);
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-size: 12px;
    margin-left: auto;
}

.git-discard-file-btn:hover {
    background-color: #ffebee;
    color: #c62828;
}

.git-discard-file-btn:active {
    transform: scale(0.9);
}

/* ==================== Flow-level breakdown ==================== */

.git-flow-units {
    border-top: 1px dashed var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background-inactive, #fafafa);
}

.git-flow-unit {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 26px;
    font-size: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #efefef);
}

.git-flow-unit:last-child { border-bottom: none; }

.git-flow-unit:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-flow-unit-status {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #999;
}

.git-flow-unit-status.git-dot-added { background: #2e7d32; }
.git-flow-unit-status.git-dot-modified { background: #e65100; }
.git-flow-unit-status.git-dot-removed { background: #c62828; }

.git-flow-unit-icon {
    width: 14px;
    text-align: center;
    color: var(--red-ui-text-color-secondary, #888);
    flex-shrink: 0;
}

.git-flow-unit-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--red-ui-text-color, #333);
}

.git-flow-unit-counts {
    font-family: monospace;
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #888);
    flex-shrink: 0;
}

.git-flow-unit-counts .add { color: #2e7d32; }
.git-flow-unit-counts .mod { color: #e65100; }
.git-flow-unit-counts .del { color: #c62828; }

.git-flow-unit-btn {
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
}

.git-flow-unit-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
    color: var(--red-ui-text-color, #333);
}

/* Flow diff modal body */
.git-diff-unit-section { margin-bottom: 14px; }

.git-diff-unit-section > strong {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    margin-bottom: 6px;
}

.git-diff-node {
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    border-radius: 4px;
    margin-bottom: 8px;
    overflow: hidden;
}

.git-diff-node-head {
    padding: 6px 10px;
    background: var(--red-ui-secondary-background-inactive, #f5f5f5);
    font-size: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--red-ui-text-color, #333);
}

.git-diff-node-type {
    font-family: monospace;
    color: var(--red-ui-text-color-secondary, #666);
}

.git-diff-node-id {
    margin-left: auto;
    font-family: monospace;
    color: var(--red-ui-text-color-subdued, #999);
}

/* The diff modal is wider/taller than the action modals */
#git-diff-modal .git-modal-content {
    max-width: 860px;
    width: 92%;
    max-height: 88vh;
}

/* Two-column (Before / After) field diff */
.git-diff-cols-header,
.git-diff-field {
    display: grid;
    grid-template-columns: 120px 1fr 1fr;
    font-family: monospace;
    font-size: 11px;
    border-top: 1px solid var(--red-ui-secondary-border-color, #f0f0f0);
}

.git-diff-cols-header {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--red-ui-text-color-secondary, #999);
    background: var(--red-ui-secondary-background-inactive, #f5f5f5);
}

.git-diff-cols-header > span { padding: 4px 8px; }

.git-diff-field-key {
    padding: 4px 8px;
    color: var(--red-ui-text-color-secondary, #888);
    word-break: break-all;
}

.git-diff-col {
    padding: 4px 8px;
    white-space: pre-wrap;
    word-break: break-all;
    border-left: 1px solid var(--red-ui-secondary-border-color, #f0f0f0);
}

.git-diff-col-before { background: rgba(198, 40, 40, 0.09); color: #c62828; }
.git-diff-col-after { background: rgba(46, 125, 50, 0.11); color: #2e7d32; }

.git-diff-empty { padding: 6px 10px; font-size: 11px; color: var(--red-ui-text-color-secondary, #999); }

/* Collapsible per-node detail in the diff modal */
.git-diff-node-head { cursor: pointer; user-select: none; }
.git-diff-node-head:hover { background: var(--red-ui-secondary-background-hover, #ececec); }
.git-diff-node-chevron { transition: transform 0.15s ease; color: var(--red-ui-text-color-secondary, #999); font-size: 10px; width: 10px; }
.git-diff-node.open .git-diff-node-chevron { transform: rotate(90deg); }
.git-diff-node-body { display: none; }
.git-diff-node.open .git-diff-node-body { display: block; }
.git-diff-node-added .fa-plus { color: #2e7d32; }
.git-diff-node-removed .fa-minus { color: #c62828; }
.git-diff-node-modified .fa-pencil { color: #e65100; }

.git-diff-node-revert {
    margin-left: 6px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
}
.git-diff-node-revert:hover {
    background: var(--red-ui-secondary-background-hover, #e0e0e0);
    color: var(--red-ui-text-color, #333);
}

/* ==================== Commit Panel ==================== */

.git-commit-panel {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
}

.git-commit-form {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.git-commit-message {
    width: 100%;
    min-height: 50px;
    padding: 6px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
    resize: vertical;
    transition: border-color 0.15s ease;
    box-sizing: border-box;
}

.git-commit-message:focus {
    outline: none;
    border-color: #4285f4;
}

.git-commit-message::placeholder {
    color: #999;
}

.git-primary-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 12px;
    border: none;
    background-color: #4285f4;
    color: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    width: 100%;
}

.git-primary-btn:hover {
    background-color: #3367d6;
    box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
}

.git-primary-btn:active {
    transform: scale(0.98);
}

.git-primary-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background-color: #999;
}

.git-primary-btn i {
    font-size: 14px;
}

/* ==================== Commits Section ==================== */

.git-commits-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* Graph Legend */
.git-graph-legend {
    display: flex;
    gap: 15px;
    margin-left: auto;
    margin-right: 10px;
    font-size: 11px;
    color: var(--red-ui-text-color-subdued, #666);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.legend-dot.pushed {
    background-color: #4A90E2;
}

.legend-dot.unpushed {
    background-color: #9B59B6;
}

.legend-dot.head {
    background-color: #27AE60;
}

/* Commit list (DOM-rendered graph + rail) */
.git-graph-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 200px;
    position: relative;
    background-color: var(--red-ui-secondary-background, #fff);
    width: 100%;
    box-sizing: border-box;
    /* Background the rail dots punch through, so lines read as "behind" them. */
    --rail-bg: var(--red-ui-secondary-background, #fff);
}

.git-commit-list { width: 100%; }

.git-commit-row {
    display: flex;
    align-items: stretch;
    min-height: 56px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee);
    cursor: pointer;
    box-sizing: border-box;
}

.git-commit-row:hover { background-color: var(--red-ui-secondary-background-hover, #f5f5f5); }
.git-commit-row.open { background-color: var(--red-ui-secondary-background-selected, var(--red-ui-secondary-background-hover, #eef3fb)); }

.git-commit-rail {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    padding-left: 6px;
}

.git-rail-svg { display: block; }
/* Dot stroke matches the panel bg so it "punches through" the rail lines. */
.git-rail-dot { stroke: var(--rail-bg, #fff); }

.git-commit-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding: 6px 12px 6px 8px;
}

.git-commit-row-top { display: flex; align-items: center; gap: 8px; min-width: 0; }

.git-commit-hashtag {
    font-family: monospace;
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #666);
    background-color: var(--red-ui-secondary-background-inactive, #f0f0f0);
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
}

.git-commit-row-msg {
    font-size: 13px;
    color: var(--red-ui-text-color, #333);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}

.git-head-chip {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #fff;
    background: #27AE60;
    padding: 1px 5px;
    border-radius: 8px;
}

.git-commit-row-bottom { display: flex; align-items: center; gap: 6px; min-width: 0; }

.git-commit-row-meta {
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #999);
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.git-branch-chip {
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    background: #2196F3;
    padding: 1px 6px;
    border-radius: 8px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* Expanded commit detail (inline, below the clicked row) */
.git-commit-detail {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background: var(--red-ui-secondary-background-inactive, #fafafa);
    padding: 10px 12px 12px;
    font-size: 12px;
}

.git-commit-detail-meta { color: var(--red-ui-text-color, #333); line-height: 1.6; word-break: break-all; }
.git-commit-detail-meta .k {
    display: inline-block;
    min-width: 52px;
    color: var(--red-ui-text-color-secondary, #888);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.3px;
}
.git-mono { font-family: monospace; }
.git-commit-detail-msg { margin-top: 6px; white-space: pre-wrap; color: var(--red-ui-text-color, #333); }

.git-commit-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0;
    padding: 10px 0;
    border-top: 1px solid var(--red-ui-secondary-border-color, #eee);
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee);
}

.git-commit-action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    background: var(--red-ui-secondary-background, #fff);
    color: var(--red-ui-text-color, #333);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.git-commit-action:hover { background: var(--red-ui-secondary-background-hover, #f0f0f0); border-color: #4285f4; }
.git-commit-action-danger { color: #c62828; border-color: #ffcdd2; }
.git-commit-action-danger:hover { background: #ffebee; border-color: #ef5350; }

.git-commit-detail-section { margin-top: 10px; }
.git-commit-detail-subhead {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    margin-bottom: 6px;
}
.git-detail-sub {
    font-weight: 400;
    text-transform: none;
    color: var(--red-ui-text-color-subdued, #999);
    font-family: monospace;
}
.git-commit-detail .git-flow-units {
    border-top: none;
    background: transparent;
    border: 1px solid var(--red-ui-secondary-border-color, #e8e8e8);
    border-radius: 4px;
}

/* Changed-files list inside commit detail */
.git-file-list {
    border: 1px solid var(--red-ui-secondary-border-color, #e8e8e8);
    border-radius: 4px;
    overflow: hidden;
}
.git-file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #efefef);
}
.git-file-row:last-child { border-bottom: none; }
.git-file-row:hover { background: var(--red-ui-secondary-background-hover, #f0f0f0); }
.git-file-status {
    flex-shrink: 0;
    width: 16px;
    text-align: center;
    font-family: monospace;
    font-weight: 700;
    font-size: 11px;
}
.git-fs-a { color: #2e7d32; }
.git-fs-m { color: #e65100; }
.git-fs-d { color: #c62828; }
.git-fs-r { color: #1565c0; }
.git-file-path {
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--red-ui-text-color, #333);
}

/* Unified text diff (file diff modal) */
.git-unified-diff {
    font-family: monospace;
    font-size: 11px;
    line-height: 1.5;
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    border-radius: 4px;
    overflow-x: auto;
}
.git-diff-line { white-space: pre; padding: 0 8px; }
.git-diff-line.dl-add { background: rgba(46, 125, 50, 0.10); color: #2e7d32; }
.git-diff-line.dl-del { background: rgba(198, 40, 40, 0.09); color: #c62828; }
.git-diff-line.dl-hunk { background: var(--red-ui-secondary-background-inactive, #f0f0f0); color: var(--red-ui-text-color-secondary, #666); }
.git-diff-line.dl-file { color: var(--red-ui-text-color-secondary, #888); }

/* ==================== Empty & Loading States ==================== */

.git-empty-state,
.git-loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    text-align: center;
    color: #999;
}

.git-empty-state i,
.git-loading-state i {
    font-size: 18px;
    margin-bottom: 4px;
    opacity: 0.5;
}

.git-empty-state p,
.git-loading-state p {
    margin: 0;

            var projectsEnabled = RED.settings.theme("projects.enabled", false);

            // Create sidebar content container
            var content = $("<div>").css({"position":"relative","height":"100%"}).addClass("git-control-panel");

                            </button>
                        </div>
                    </div>

                    <!-- Detached HEAD Warning Banner -->
                    <div class="git-warning-banner" id="git-detached-head-banner" style="display: none;">

                                <strong>DETACHED HEAD</strong>
                                <p>You're viewing an old commit. Creating commits here will rewrite history when pushed.</p>

                            <span>Return to Latest</span>

                    <!-- Conflict / in-progress operation Banner -->
                    <div class="git-warning-banner git-conflict-banner" id="git-conflict-banner" style="display: none;">
                        <div class="git-warning-content">
                            <i class="fa fa-exclamation-triangle"></i>
                            <div class="git-warning-text">
                                <strong id="git-conflict-title">MERGE CONFLICT</strong>
                                <p id="git-conflict-text"></p>
                                <div class="git-conflict-files" id="git-conflict-files"></div>
                            </div>
                        </div>
                        <button class="git-warning-action git-conflict-abort" id="git-conflict-abort">
                            <i class="fa fa-times-circle"></i>
                            <span>Abort</span>
                        </button>
                    </div>

                    <!-- Branch Section -->
                    <div class="git-branch-section">
                        <div class="git-branch-current">
                            <i class="fa fa-code-fork"></i>
                            <span id="git-current-branch-name">main</span>
                        </div>
                        <select class="git-branch-selector" id="git-branch-selector">
                            <option value="">Loading branches...</option>
                        </select>

                    <!-- Changes Section (single list - commit stages everything) -->
                    <div class="git-changes-section" id="git-unstaged-section">
                        <div class="git-section-header">
                            <i class="fa fa-file-o"></i>
                            <span>Changes</span>
                            <span class="git-badge" id="git-unstaged-count">0</span>

                        <div class="git-changes-list" id="git-unstaged-list">

                    </div>

                    <!-- Commit Panel -->
                    <div class="git-commit-panel" id="git-commit-panel">
                        <div class="git-section-header">
                            <i class="fa fa-code-fork"></i>
                            <span>Create Commit</span>

                        <div class="git-commit-form">
                            <textarea
                                id="git-commit-message"
                                class="git-commit-message"
                                placeholder="Enter commit message..."
                                rows="3"
                            ></textarea>
                            <button class="git-primary-btn" id="git-btn-commit" disabled>
                                <i class="fa fa-check"></i>
                                <span>Commit</span>
                            </button>
                        </div>
                    </div>

                    <!-- Commits Section -->
                    <div class="git-commits-section">
                        <div class="git-section-header">

            content.html(html);

            // Global state
            var allCommits = [];
            var currentBranch = '';
            var projectInfo = null;
            // Hash of the commit whose inline detail panel is open (so it survives a refresh).
            var expandedHash = null;
            // Which ref a node/unit revert inside the diff modal targets, set when the modal opens.
            var currentDiffCtx = { ref: 'HEAD', verb: 'revert' };

            // Escape untrusted text (file paths, commit messages, authors) before
            // inserting into HTML / attributes, to avoid breakage and injection.
            function escapeHtml(value) {
                return $('<div>').text(value == null ? '' : String(value)).html();
            }
            function escapeAttr(value) {
                return escapeHtml(value).replace(/"/g, '&quot;');
            }

            // Register keyboard shortcut to show the tab.
            // Showing it triggers the tab's onchange.
            RED.actions.add("core:show-git-control-tab", function() {
                RED.sidebar.show("rosepetal-git-control");
            });

            // Add sidebar tab
            RED.sidebar.addTab({
                id: "rosepetal-git-control",
                label: "Git Control",
                name: "Git Control",
                iconClass: "fa fa-git",
                content: content,
                action: "core:show-git-control-tab",
                // onchange: whenever this tab is selected (clicked or restored on load).
                // Delayed 100 ms because container is created a bit later.
                onchange: function() {
                    setTimeout(loadAll, 100);
                },
                enableOnEdit: false
            });

            // Initialize UI handlers AFTER sidebar is added to DOM
            setupEventHandlers();

            // Load initial data (everything except commits - commits need visible tab)
            loadProjectInfo();
            loadBranches();
            loadChanges();

            // The commit list is DOM, so it renders into a hidden/zero-width
            // container fine - no need to wait for layout (the old canvas did).
            loadCommits(50);

            // Listen to Node-RED deploy events to refresh immediately
            RED.events.on("deploy", function() {
                // Slight delay to allow git operations to complete
                setTimeout(function() {
                    loadAll();
                }, 1000);
            });

            function setupEventHandlers() {
                // Toolbar actions
                $('#git-btn-fetch').on('click', handleFetch);
                $('#git-btn-pull').on('click', handlePull);
                $('#git-btn-push').on('click', handlePush);
                $('#git-btn-refresh').on('click', loadAll);

                // Branch selector
                $('#git-branch-selector').on('change', handleBranchSwitch);

                // Commit button
                $('#git-btn-commit').on('click', handleCommit);

                // Blocking modal close
                $('#git-blocking-close, #git-blocking-overlay').on('click', function() {
                    $('#git-blocking-modal').fadeOut(200);
                });

                // Diff modal close
                $('#git-diff-close, #git-diff-overlay').on('click', function() {
                    $('#git-diff-modal').fadeOut(150);
                });

                // Expand/collapse a node's field detail inside the diff modal
                $('#git-diff-body').on('click', '.git-diff-node-head', function() {
                    $(this).closest('.git-diff-node').toggleClass('open');
                });

                // Revert a single node (don't also toggle the collapse)
                $('#git-diff-body').on('click', '.git-diff-node-revert', function(e) {
                    e.stopPropagation();
                    revertFlowNode($(this).attr('data-node-id'));
                });
