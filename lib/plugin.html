<style type="text/css">
/* Git Control Panel - Modern VS Code Style */

.git-control-panel {
    padding: 0;
    overflow: hidden;
    background-color: var(--red-ui-secondary-background, #fff);
    width: 100%;
    box-sizing: border-box;
}

.git-control-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow-y: auto;
    box-sizing: border-box;
}

/* ==================== Toolbar ==================== */

.git-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    border-bottom: 1px solid var(--red-ui-primary-border-color, #ddd);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 48px;
}

.git-toolbar-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    color: var(--red-ui-text-color-heading, #333);
    flex: 0 1 auto;
    min-width: 0;
}

.git-toolbar-title i {
    color: #f05033;
    font-size: 16px;
}

.git-toolbar-actions {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
}

.git-toolbar-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color, #333);
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.15s ease;
}

.git-toolbar-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-toolbar-btn:active {
    transform: scale(0.95);
}

.git-toolbar-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.git-sync-indicator {
    position: absolute;
    top: 2px;
    right: 2px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    background-color: #ff6b6b;
    color: white;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    display: none;
    align-items: center;
    justify-content: center;
}

/* ==================== Branch Section ==================== */

.git-branch-section {
    padding: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
}

/* Two-row branch picker layout: each row is [icon] [combo] [right-cell].
   Right-cell on the branch row is the ⋮ button; on the upstream row an empty
   spacer of the same width, so both combo inputs share identical left/right
   edges regardless of which row has the menu. */
.git-branch-row {
    position: relative;     /* anchor for the menu dropdown */
    display: flex;
    align-items: center;
    gap: 8px;
}
.git-branch-row + .git-branch-row { margin-top: 6px; }

.git-branch-row-icon {
    flex: 0 0 18px;
    width: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    transition: color 0.15s ease;
}
.git-branch-row-icon:hover { color: var(--red-ui-text-color, #333); }
.git-branch-row-icon-fork { color: #4285f4; }
.git-branch-row-icon-fork:hover { color: #1a73e8; }

.git-branch-row-combo { flex: 1 1 auto; min-width: 0; }
.git-branch-row-combo .git-combo { width: 100%; }

.git-branch-row-spacer { flex: 0 0 34px; }

.git-branch-icon-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    box-sizing: border-box;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 6px;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.git-branch-icon-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #eee);
    color: var(--red-ui-text-color, #333);
}

/* ==================== Type-to-filter combobox ==================== */
.git-combo { position: relative; min-width: 0; }

.git-combo-input {
    width: 100%;
    min-width: 0;     /* text inputs default to ~20ch; without this they refuse to shrink in a flex row */
    height: 34px;
    box-sizing: border-box;
    padding: 6px 10px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 6px;
    font-size: 12px;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
}

.git-combo-input:focus {
    outline: none;
    border-color: #4285f4;
    box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.18);
}

.git-combo-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 30;
    max-height: 240px;
    overflow-y: auto;
    padding: 4px;
    background-color: var(--red-ui-primary-background, #fff);
    border: 1px solid var(--red-ui-secondary-border-color, #ccc);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
}

.git-combo-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    color: var(--red-ui-text-color, #333);
}

.git-combo-option .git-combo-label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.git-combo-option .git-combo-mark {
    flex: 0 0 auto;
    width: 12px;
    font-size: 11px;
    color: #4285f4;
}

.git-combo-option:hover,
.git-combo-option.active {
    background-color: rgba(66, 133, 244, 0.12);
}

.git-combo-option.current { font-weight: 600; }

/* "Create new" row — a branch (or remote branch) that doesn't exist yet. */
.git-combo-option-new .git-combo-mark,
.git-combo-option-new .git-combo-label { color: #2e9e5b; }
.git-combo-option-new .git-combo-label { font-weight: 600; }

.git-combo-badge {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 999px;
    color: #2e9e5b;
    background-color: rgba(46, 158, 91, 0.14);
}

/* Remote-only entry — picking it DWIMs a local tracking branch on checkout. */
.git-combo-option-remote .git-combo-mark { color: var(--red-ui-text-color-secondary, #888); }
.git-combo-option-remote .git-combo-label { color: var(--red-ui-text-color-secondary, #777); }
.git-combo-option-remote .git-combo-badge {
    color: var(--red-ui-text-color-secondary, #888);
    background-color: rgba(120, 120, 120, 0.14);
}

.git-combo-empty {
    padding: 10px;
    font-size: 12px;
    text-align: center;
    color: var(--red-ui-text-color-secondary, #999);
}

/* Inline mode: list is always open and sits in normal flow (used inside the
   picker modal, where an absolute dropdown would be clipped by the body). */
.git-combo-inline .git-combo-list {
    position: static;
    margin-top: 8px;
    max-height: 46vh;
    box-shadow: none;
}

#git-prompt-combo .git-combo-input { height: 38px; font-size: 13px; }

.git-branch-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    z-index: 20;
    min-width: 230px;
    padding: 4px;
    background-color: var(--red-ui-primary-background, #fff);
    border: 1px solid var(--red-ui-secondary-border-color, #ccc);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
}

.git-branch-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color, #333);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
}

.git-branch-menu-item:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-branch-menu-item i {
    width: 14px;
    text-align: center;
    color: var(--red-ui-text-color-secondary, #888);
}

/* ==================== Prompt modal ==================== */

.git-prompt-content {
    max-width: 420px;
}

.git-prompt-hint {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--red-ui-text-color-secondary, #666);
}

.git-prompt-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    font-size: 13px;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
    box-sizing: border-box;
}

.git-prompt-input:focus {
    outline: none;
    border-color: #4285f4;
}

.git-prompt-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
}

.git-prompt-actions .git-primary-btn,
.git-secondary-btn {
    width: auto;
    padding: 8px 16px;
}

.git-secondary-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    background-color: var(--red-ui-secondary-background, #fff);
    color: var(--red-ui-text-color, #333);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.git-secondary-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #eee);
}

/* ==================== Changes Section ==================== */

.git-changes-section {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
}

.git-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background-color: var(--red-ui-secondary-background-inactive, #f9f9f9);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    user-select: none;
}

.git-section-header:hover {
    background-color: var(--red-ui-secondary-background-hover, #e8e8e8);
}

.git-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    background-color: #e0e0e0;
    color: #333;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
}

.git-changes-list {
    max-height: 200px;
    overflow-y: auto;
}

.git-change-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.git-change-item:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-change-status {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    font-weight: 600;
    font-size: 10px;
}

.git-status-m .git-change-status {
    background-color: #fff3e0;
    color: #e65100;
}

.git-status-a .git-change-status {
    background-color: #e8f5e9;
    color: #2e7d32;
}

.git-status-d .git-change-status {
    background-color: #ffebee;
    color: #c62828;
}

.git-status-u .git-change-status {
    background-color: #f3e5f5;
    color: #6a1b9a;
}

.git-change-file {
    flex: 1;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    word-break: break-all;
}

/* Discard file button */
.git-discard-file-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #999);
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-size: 12px;
    margin-left: auto;
}

.git-discard-file-btn:hover {
    background-color: #ffebee;
    color: #c62828;
}

.git-discard-file-btn:active {
    transform: scale(0.9);
}

/* ==================== Flow-level breakdown ==================== */

.git-flow-units {
    border-top: 1px dashed var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background-inactive, #fafafa);
}

.git-flow-unit {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 26px;
    font-size: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #efefef);
}

.git-flow-unit:last-child { border-bottom: none; }

.git-flow-unit:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
}

.git-flow-unit-clickable {
    cursor: pointer;
}

.git-flow-unit-status {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #999;
}

.git-flow-unit-status.git-dot-added { background: #2e7d32; }
.git-flow-unit-status.git-dot-modified { background: #e65100; }
.git-flow-unit-status.git-dot-removed { background: #c62828; }

.git-flow-unit-icon {
    width: 14px;
    text-align: center;
    color: var(--red-ui-text-color-secondary, #888);
    flex-shrink: 0;
}

.git-flow-unit-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--red-ui-text-color, #333);
}

.git-flow-unit-counts {
    font-family: monospace;
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #888);
    flex-shrink: 0;
}

.git-flow-unit-counts .add { color: #2e7d32; }
.git-flow-unit-counts .mod { color: #e65100; }
.git-flow-unit-counts .del { color: #c62828; }

.git-flow-unit-btn {
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
}

.git-flow-unit-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
    color: var(--red-ui-text-color, #333);
}

/* Flow diff modal body */
.git-diff-unit-section { margin-bottom: 14px; }

.git-diff-unit-section > strong {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    margin-bottom: 6px;
}

.git-diff-node {
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    border-radius: 4px;
    margin-bottom: 8px;
    overflow: hidden;
}

.git-diff-node-head {
    padding: 6px 10px;
    background: var(--red-ui-secondary-background-inactive, #f5f5f5);
    font-size: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--red-ui-text-color, #333);
}

.git-diff-node-type {
    font-family: monospace;
    color: var(--red-ui-text-color-secondary, #666);
}

.git-diff-node-id {
    margin-left: auto;
    font-family: monospace;
    color: var(--red-ui-text-color-subdued, #999);
}

/* The diff modal is wider/taller than the action modals */
#git-diff-modal .git-modal-content {
    max-width: 860px;
    width: 92%;
    max-height: 88vh;
}

/* ==================== Merge Resolution Modal ==================== */

/* The merge resolver fills more of the viewport since the user reasons over
   many conflict cards at once. */
#git-resolve-modal .git-modal-content,
.git-resolve-content {
    max-width: 1100px;
    width: 92%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.git-resolve-header {
    flex: 0 0 auto;
    padding: 14px 20px 10px 20px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background: linear-gradient(180deg, #fafafa 0%, #f0f0f0 100%);
}
.git-resolve-titlebar { display: flex; align-items: center; justify-content: space-between; }
.git-resolve-titlebar h4 { margin: 0; font-size: 16px; font-weight: 600; color: #b71c1c; }

.git-resolve-context {
    margin-top: 8px;
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: #555;
}
.git-resolve-context > div { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.git-resolve-context .git-resolve-arrow { color: #888; }
.git-resolve-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
}
.git-resolve-chip-ours   { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }
.git-resolve-chip-theirs { background: #efebe9; color: #4e342e; border: 1px solid #bcaaa4; }
.git-resolve-commitline { font-family: monospace; font-size: 11px; color: #666; }
.git-resolve-commitline strong { color: #333; font-weight: 600; }

.git-resolve-summary {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 8px 20px; background: #fff8e1; border-bottom: 1px solid #ffe082;
    font-size: 12px; color: #5d4037;
}
.git-resolve-summary .git-resolve-counts { flex: 1 1 auto; }
.git-resolve-summary button {
    flex: 0 0 auto; font-size: 11px; padding: 3px 10px; cursor: pointer;
    background: #fff; border: 1px solid #9e9e9e; color: #424242; border-radius: 4px;
}
.git-resolve-summary button:hover { background: #f5f5f5; }
.git-resolve-summary .git-resolve-bulk-ours   { border-color: #0d47a1; color: #0d47a1; }
.git-resolve-summary .git-resolve-bulk-ours:hover { background: #e3f2fd; }
.git-resolve-summary .git-resolve-bulk-ours.is-active {
    background: #0d47a1; border-color: #0d47a1; color: #fff;
}
.git-resolve-summary .git-resolve-bulk-ours.is-active:hover { background: #0a3a87; }
.git-resolve-summary .git-resolve-bulk-theirs { border-color: #4e342e; color: #4e342e; }
.git-resolve-summary .git-resolve-bulk-theirs:hover { background: #efebe9; }
.git-resolve-summary .git-resolve-bulk-theirs.is-active {
    background: #4e342e; border-color: #4e342e; color: #fff;
}
.git-resolve-summary .git-resolve-bulk-theirs.is-active:hover { background: #3e2723; }

.git-resolve-body {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 20px;
    background: #fafafa;
}
.git-resolve-empty { padding: 24px; text-align: center; color: #555; font-size: 13px; }

/* Unit card */
.git-resolve-unit {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px;
}
.git-resolve-unit-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding-bottom: 8px; border-bottom: 1px dashed #eee; margin-bottom: 8px;
}
.git-resolve-unit-kind {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: #f5f5f5; color: #757575; text-transform: uppercase; letter-spacing: 0.5px;
}
.git-resolve-unit-label { flex: 1 1 auto; font-weight: 600; font-size: 13px; color: #333; }
.git-resolve-unit-count {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #ffcdd2; color: #b71c1c; font-weight: 600;
}
.git-resolve-unit-pick {
    font-size: 11px; padding: 3px 10px; cursor: pointer;
    background: #fff; border: 1px solid #c62828; color: #c62828; border-radius: 4px;
}
.git-resolve-unit-pick:hover { background: #ffebee; }
.git-resolve-unit-pick.is-active { background: #c62828; color: #fff; }
.git-resolve-unit-pick.is-active:hover { background: #b71c1c; }
.git-resolve-unit-structural {
    margin-bottom: 8px; padding: 6px 10px;
    background: #fffde7; border-left: 3px solid #fbc02d;
    font-size: 11px; color: #5d4037;
}

/* Per-node conflict block */
.git-resolve-node {
    border: 1px solid #f5f5f5; border-radius: 6px; margin-bottom: 8px;
    background: #fafbfc;
}
.git-resolve-node-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px;
    user-select: none;
}
.git-resolve-node-header.git-resolve-node-toggle { cursor: pointer; }
.git-resolve-node-header.git-resolve-node-toggle:hover { background: #f0f4f8; }
.git-resolve-node-chevron {
    width: 12px; color: #888; font-size: 11px; flex: 0 0 12px; text-align: center;
    transition: transform 0.1s ease;
}
.git-resolve-node-icon { width: 16px; text-align: center; }
.git-resolve-node-icon.is-conflict { color: #c62828; }
.git-resolve-node-icon.is-structural { color: #ef6c00; }
.git-resolve-node-label { flex: 1 1 auto; min-width: 0; font-size: 12px; color: #333; }
.git-resolve-node-label strong { font-weight: 600; }
.git-resolve-node-label .git-resolve-node-id {
    font-family: monospace; font-size: 10px; opacity: 0.6; margin-left: 6px;
}
.git-resolve-node-pick {
    font-size: 11px; padding: 3px 10px; cursor: pointer;
    background: #fff; border: 1px solid #9e9e9e; color: #424242; border-radius: 4px;
}
.git-resolve-node-pick:hover { background: #f0f0f0; }
.git-resolve-node-pick.is-ours.is-active   { background: #0d47a1; border-color: #0d47a1; color: #fff; }
.git-resolve-node-pick.is-theirs.is-active { background: #4e342e; border-color: #4e342e; color: #fff; }
.git-resolve-node-pick.is-inherited { opacity: 0.55; }

/* Per-field diff table */
.git-resolve-fields {
    border-top: 1px solid #e0e0e0; padding: 8px 10px;
    display: grid; grid-template-columns: 130px 1fr 1fr; gap: 4px 8px;
    font-size: 11px; align-items: start;
}
.git-resolve-fields-header {
    font-weight: 600; color: #777; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    padding-bottom: 4px; border-bottom: 1px solid #f0f0f0;
}
.git-resolve-fields-header.is-ours   { color: #0d47a1; }
.git-resolve-fields-header.is-theirs { color: #4e342e; }
.git-resolve-field-name { font-family: monospace; color: #555; padding-top: 2px; }
.git-resolve-field-value {
    font-family: monospace; word-break: break-all; white-space: pre-wrap;
    padding: 2px 6px; border-radius: 3px; background: #fff;
    max-height: 240px; overflow: auto;
}
.git-resolve-field-value.is-ours   { background: #e3f2fd; }
.git-resolve-field-value.is-theirs { background: #efebe9; }
.git-resolve-field-value.is-deleted {
    color: #b71c1c; font-style: italic; background: #ffebee;
}
.git-resolve-field-value .git-resolve-expand {
    display: inline-block; cursor: pointer; color: #1976d2;
    padding: 0 4px; text-decoration: none; user-select: none;
}
.git-resolve-fields-unchanged {
    grid-column: 1 / -1; text-align: center; margin-top: 6px;
    font-size: 11px; color: #888; cursor: pointer; user-select: none;
}
.git-resolve-fields-unchanged:hover { color: #1976d2; }

/* Long-value diff (per-line) */
.git-resolve-multiline {
    grid-column: 1 / -1; margin-top: 4px; background: #fff;
    border: 1px solid #e0e0e0; border-radius: 4px; padding: 6px 8px;
    font-family: monospace; font-size: 10px; max-height: 280px; overflow: auto;
}
.git-resolve-multiline .ml-line { white-space: pre-wrap; word-break: break-all; }
.git-resolve-multiline .ml-add    { background: #e8f5e9; color: #1b5e20; }
.git-resolve-multiline .ml-del    { background: #ffebee; color: #b71c1c; }
.git-resolve-multiline .ml-same   { color: #555; }

/* Commit editor row */
.git-resolve-commit {
    flex: 0 0 auto;
    padding: 10px 20px 4px 20px;
    border-top: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background: #fff;
}
.git-resolve-commit label {
    display: block; font-size: 11px; color: #666; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
}
.git-resolve-commit textarea {
    width: 100%; box-sizing: border-box; font-family: monospace; font-size: 12px;
    padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 4px;
    resize: vertical; min-height: 64px; max-height: 220px;
}

/* Footer */
.git-resolve-footer {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; border-top: 1px solid #e0e0e0;
    background: #fafafa;
}
.git-resolve-progress { flex: 1 1 auto; font-size: 12px; color: #555; }
.git-resolve-progress.is-ready { color: #2e7d32; font-weight: 600; }
.git-resolve-actions { display: flex; gap: 8px; }
.git-resolve-abort, .git-resolve-commit-btn {
    padding: 8px 14px; font-size: 12px; border-radius: 4px;
    border: none; cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
}
.git-resolve-abort { background: #e53935; color: #fff; }
.git-resolve-abort:hover { background: #c62828; }
.git-resolve-commit-btn { background: #2e7d32; color: #fff; }
.git-resolve-commit-btn:hover { background: #1b5e20; }
.git-resolve-commit-btn:disabled { background: #a5d6a7; cursor: not-allowed; }

/* Sidebar conflict banner: compact "open modal" form when flow-aware
   resolution is available — replaces the inline resolver. */
.git-conflict-open {
    background-color: #c62828;
    color: #fff;
}
.git-conflict-open:hover { background-color: #b71c1c; }

/* Two-column (Before / After) field diff */
.git-diff-cols-header,
.git-diff-field {
    display: grid;
    grid-template-columns: 120px 1fr 1fr;
    font-family: monospace;
    font-size: 11px;
    border-top: 1px solid var(--red-ui-secondary-border-color, #f0f0f0);
}

.git-diff-cols-header {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--red-ui-text-color-secondary, #999);
    background: var(--red-ui-secondary-background-inactive, #f5f5f5);
}

.git-diff-cols-header > span { padding: 4px 8px; }

.git-diff-field-key {
    padding: 4px 8px;
    color: var(--red-ui-text-color-secondary, #888);
    word-break: break-all;
}

.git-diff-col {
    padding: 4px 8px;
    white-space: pre-wrap;
    word-break: break-all;
    border-left: 1px solid var(--red-ui-secondary-border-color, #f0f0f0);
}

.git-diff-col-before { background: rgba(198, 40, 40, 0.09); color: #c62828; }
.git-diff-col-after { background: rgba(46, 125, 50, 0.11); color: #2e7d32; }

.git-diff-empty { padding: 6px 10px; font-size: 11px; color: var(--red-ui-text-color-secondary, #999); }

/* Collapsible per-node detail in the diff modal */
.git-diff-node-head { cursor: pointer; user-select: none; }
.git-diff-node-head:hover { background: var(--red-ui-secondary-background-hover, #ececec); }
.git-diff-node-chevron { transition: transform 0.15s ease; color: var(--red-ui-text-color-secondary, #999); font-size: 10px; width: 10px; }
.git-diff-node.open .git-diff-node-chevron { transform: rotate(90deg); }
.git-diff-node-body { display: none; }
.git-diff-node.open .git-diff-node-body { display: block; }
.git-diff-node-added .fa-plus { color: #2e7d32; }
.git-diff-node-removed .fa-minus { color: #c62828; }
.git-diff-node-modified .fa-pencil { color: #e65100; }

.git-diff-node-revert {
    margin-left: 6px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    cursor: pointer;
    border-radius: 3px;
    flex-shrink: 0;
}
.git-diff-node-revert:hover {
    background: var(--red-ui-secondary-background-hover, #e0e0e0);
    color: var(--red-ui-text-color, #333);
}

/* ==================== Commit Panel ==================== */

.git-commit-panel {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
}

.git-commit-form {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.git-commit-message {
    width: 100%;
    min-height: 50px;
    padding: 6px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color, #333);
    resize: vertical;
    transition: border-color 0.15s ease;
    box-sizing: border-box;
}

.git-commit-message:focus {
    outline: none;
    border-color: #4285f4;
}

.git-commit-message::placeholder {
    color: #999;
}

.git-primary-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 12px;
    border: none;
    background-color: #4285f4;
    color: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    width: 100%;
}

.git-primary-btn:hover {
    background-color: #3367d6;
    box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
}

.git-primary-btn:active {
    transform: scale(0.98);
}

.git-primary-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background-color: #999;
}

.git-primary-btn i {
    font-size: 14px;
}

/* ==================== Commits Section ==================== */

.git-commits-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* Graph Legend */
.git-graph-legend {
    display: flex;
    gap: 15px;
    margin-left: auto;
    margin-right: 10px;
    font-size: 11px;
    color: var(--red-ui-text-color-subdued, #666);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.legend-dot.pushed {
    background-color: #4A90E2;
}

.legend-dot.unpushed {
    background-color: #9B59B6;
}

.legend-dot.head {
    background-color: #27AE60;
}

/* Commit list (DOM-rendered graph + rail) */
.git-graph-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 200px;
    position: relative;
    background-color: var(--red-ui-secondary-background, #fff);
    width: 100%;
    box-sizing: border-box;
    /* Background the rail dots punch through, so lines read as "behind" them. */
    --rail-bg: var(--red-ui-secondary-background, #fff);
}

.git-commit-list { width: 100%; }

.git-commit-row {
    display: flex;
    align-items: stretch;
    min-height: 56px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee);
    cursor: pointer;
    box-sizing: border-box;
}

.git-commit-row:hover { background-color: var(--red-ui-secondary-background-hover, #f5f5f5); }
.git-commit-row.open { background-color: var(--red-ui-secondary-background-selected, var(--red-ui-secondary-background-hover, #eef3fb)); }

.git-commit-rail {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    padding-left: 6px;
}

.git-rail-svg { display: block; }
/* Dot stroke matches the panel bg so it "punches through" the rail lines. */
.git-rail-dot { stroke: var(--rail-bg, #fff); }

.git-commit-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding: 6px 12px 6px 8px;
}

.git-commit-row-top { display: flex; align-items: center; gap: 8px; min-width: 0; }

.git-commit-hashtag {
    font-family: monospace;
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #666);
    background-color: var(--red-ui-secondary-background-inactive, #f0f0f0);
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
}

.git-commit-row-msg {
    font-size: 13px;
    color: var(--red-ui-text-color, #333);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}

.git-head-chip {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #fff;
    background: #27AE60;
    padding: 1px 5px;
    border-radius: 8px;
}

.git-commit-row-bottom { display: flex; align-items: center; gap: 6px; min-width: 0; }

.git-commit-row-meta {
    font-size: 11px;
    color: var(--red-ui-text-color-secondary, #999);
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.git-branch-chip {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    background: #2196F3;
    padding: 1px 6px;
    border-radius: 8px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* The branch the commit detail's chips belong to vs the rest */
.git-branch-chip-current {
    background: #27AE60;
}

.git-branch-chip-remote {
    background: transparent;
    color: var(--red-ui-text-color-secondary, #888);
    border: 1px solid var(--red-ui-secondary-border-color, #bbb);
}

.git-commit-branches { line-height: 1.9; }

/* Expanded commit detail (inline, below the clicked row) */
.git-commit-detail {
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background: var(--red-ui-secondary-background-inactive, #fafafa);
    padding: 10px 12px 12px;
    font-size: 12px;
}

.git-commit-detail-meta { color: var(--red-ui-text-color, #333); line-height: 1.6; word-break: break-all; }
.git-commit-detail-meta .k {
    display: inline-block;
    min-width: 52px;
    color: var(--red-ui-text-color-secondary, #888);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.3px;
}
.git-mono { font-family: monospace; }
.git-commit-detail-msg { margin-top: 6px; white-space: pre-wrap; color: var(--red-ui-text-color, #333); }

.git-commit-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0;
    padding: 10px 0;
    border-top: 1px solid var(--red-ui-secondary-border-color, #eee);
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #eee);
}

.git-commit-action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    background: var(--red-ui-secondary-background, #fff);
    color: var(--red-ui-text-color, #333);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
.git-commit-action:hover { background: var(--red-ui-secondary-background-hover, #f0f0f0); border-color: #4285f4; }
.git-commit-action-danger { color: #c62828; border-color: #ffcdd2; }
.git-commit-action-danger:hover { background: #ffebee; border-color: #ef5350; }

.git-commit-detail-section { margin-top: 10px; }
.git-commit-detail-subhead {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--red-ui-text-color-secondary, #666);
    margin-bottom: 6px;
}
.git-detail-sub {
    font-weight: 400;
    text-transform: none;
    color: var(--red-ui-text-color-subdued, #999);
    font-family: monospace;
}
.git-commit-detail .git-flow-units {
    border-top: none;
    background: transparent;
    border: 1px solid var(--red-ui-secondary-border-color, #e8e8e8);
    border-radius: 4px;
}

/* Changed-files list inside commit detail */
.git-file-list {
    border: 1px solid var(--red-ui-secondary-border-color, #e8e8e8);
    border-radius: 4px;
    overflow: hidden;
}
.git-file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #efefef);
}
.git-file-row:last-child { border-bottom: none; }
.git-file-row:hover { background: var(--red-ui-secondary-background-hover, #f0f0f0); }
.git-file-status {
    flex-shrink: 0;
    width: 16px;
    text-align: center;
    font-family: monospace;
    font-weight: 700;
    font-size: 11px;
}
.git-fs-a { color: #2e7d32; }
.git-fs-m { color: #e65100; }
.git-fs-d { color: #c62828; }
.git-fs-r { color: #1565c0; }
.git-file-path {
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--red-ui-text-color, #333);
}

/* Unified text diff (file diff modal) */
.git-unified-diff {
    font-family: monospace;
    font-size: 11px;
    line-height: 1.5;
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    border-radius: 4px;
    overflow-x: auto;
}
.git-diff-line { white-space: pre; padding: 0 8px; }
.git-diff-line.dl-add { background: rgba(46, 125, 50, 0.10); color: #2e7d32; }
.git-diff-line.dl-del { background: rgba(198, 40, 40, 0.09); color: #c62828; }
.git-diff-line.dl-hunk { background: var(--red-ui-secondary-background-inactive, #f0f0f0); color: var(--red-ui-text-color-secondary, #666); }
.git-diff-line.dl-file { color: var(--red-ui-text-color-secondary, #888); }

/* ==================== Empty & Loading States ==================== */

.git-empty-state,
.git-loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    text-align: center;
    color: #999;
}

.git-empty-state i,
.git-loading-state i {
    font-size: 18px;
    margin-bottom: 4px;
    opacity: 0.5;
}

.git-empty-state p,
.git-loading-state p {
    margin: 0;
    font-size: 12px;
}

.git-empty-state i {
    color: #4caf50;
}

/* ==================== Modal ==================== */

.git-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.git-modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
}

.git-modal-content {
    position: relative;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    background-color: var(--red-ui-primary-background, #fff);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.git-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
}

.git-modal-header h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--red-ui-text-color-heading, #333);
}

.git-modal-close {
    width: 32px;
    height: 32px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease;
}

.git-modal-close:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.git-modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.git-action-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--red-ui-secondary-border-color, #e0e0e0);
    background-color: var(--red-ui-secondary-background, #fff);
    color: var(--red-ui-text-color, #333);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
}

.git-action-btn:hover {
    background-color: var(--red-ui-secondary-background-hover, #f0f0f0);
    border-color: #4285f4;
}

.git-action-btn i {
    width: 16px;
    text-align: center;
    color: #4285f4;
}

.git-action-btn.git-action-danger {
    border-color: #ffcdd2;
    background-color: #ffebee;
}

.git-action-btn.git-action-danger:hover {
    background-color: #ffcdd2;
    border-color: #ef5350;
}

.git-action-btn.git-action-danger i {
    color: #c62828;
}

/* ==================== Utility Buttons ==================== */

.git-btn-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: none;
    background-color: transparent;
    color: var(--red-ui-text-color-secondary, #666);
    cursor: pointer;
    border-radius: 3px;
    transition: background-color 0.15s ease;
}

.git-btn-icon:hover {
    background-color: var(--red-ui-secondary-background-hover, #e0e0e0);
}

.git-discard-btn {
    margin-left: auto;
    color: #c62828 !important;
}

.git-discard-btn:hover {
    background-color: #ffebee !important;
}

/* ==================== Scrollbar Styling ==================== */

.git-graph-container::-webkit-scrollbar,
.git-changes-list::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.git-graph-container::-webkit-scrollbar-track,
.git-changes-list::-webkit-scrollbar-track {
    background: transparent;
}

.git-graph-container::-webkit-scrollbar-thumb,
.git-changes-list::-webkit-scrollbar-thumb {
    background: var(--red-ui-secondary-border-color, #ccc);
    border-radius: 4px;
}

.git-graph-container::-webkit-scrollbar-thumb:hover,
.git-changes-list::-webkit-scrollbar-thumb:hover {
    background: var(--red-ui-secondary-border-color-hover, #999);
}

/* ==================== Dark Mode Support ==================== */

body.red-ui-theme-midnight .git-toolbar {
    background-color: #2d2d2d;
    border-color: #444;
}

body.red-ui-theme-midnight .git-toolbar-title,
body.red-ui-theme-midnight .git-commit-message,
body.red-ui-theme-midnight .git-modal-header h4 {
    color: #ddd;
}

body.red-ui-theme-midnight .git-toolbar-btn,
body.red-ui-theme-midnight .git-action-btn {

                                    <button class="git-resolve-commit-btn" id="git-resolve-commit">

            `;

            content.html(html);

            // Global state
            var allCommits = [];
            var currentBranch = '';
            var projectInfo = null;

            var mergeResolver = {

                fileMergeable: false, expanded: {}, showUnchanged: {}, showLong: {},
                commitMessage: null
            };
            // The branch picker combobox (created after the markup is in the DOM).
            var branchCombo = null;
            // The upstream / remote-branch picker (Node-RED style "Find or create
            // a remote branch") — drives set-upstream / publish-push.
            var upstreamCombo = null;
            // Snapshots from the last /branches load, kept so the combos' predicates
            // (isRemote / isNew) can answer per-render without re-fetching.
            var currentRemoteOnly = [];   // bare names of remote-only branches
            var currentRemoteRefs = [];   // full "origin/x" refs for the upstream combo
            // The combobox shown inside the prompt modal in select mode (built per open).
            var promptCombo = null;
            // Pending callback for the generic prompt modal (set while it is open).
            var promptCallback = null;
            // Hash of the commit whose inline detail panel is open (so it survives a refresh).
            var expandedHash = null;
            // Which ref a node/unit revert inside the diff modal targets, set when the modal opens.
            var currentDiffCtx = { ref: 'HEAD', verb: 'revert' };

            // Escape untrusted text (file paths, commit messages, authors) before
            // inserting into HTML / attributes, to avoid breakage and injection.
            function escapeHtml(value) {
                return $('<div>').text(value == null ? '' : String(value)).html();
            }
            function escapeAttr(value) {
                return escapeHtml(value).replace(/"/g, '&quot;');
            }

            // Register keyboard shortcut to show the tab.
            // Showing it triggers the tab's onchange.
            RED.actions.add("core:show-git-control-tab", function() {
                RED.sidebar.show("rosepetal-git-control");
            });

            // Add sidebar tab
            RED.sidebar.addTab({
                id: "rosepetal-git-control",
                label: "Git Control",
                name: "Git Control",
                iconClass: "fa fa-git",
                content: content,
                action: "core:show-git-control-tab",
                // onchange: whenever this tab is selected (clicked or restored on load).
                // Delayed 100 ms because container is created a bit later.
                onchange: function() {
                    setTimeout(loadAll, 100);
                },
                enableOnEdit: false
            });

            // Build the branch picker (type-to-filter) into its mount.
            // Lists local branches + remote-only branches (rendered with a cloud
            // marker; picking one DWIMs a local tracking branch on checkout).
            // Typing a name not in either list offers a "+ Create" row.
            branchCombo = createCombo({
                placeholder: 'Find or create a branch',
                allowCreate: true,
                normalizeCreate: function(t) { return t.trim() || null; },
                isRemote: function(v) { return currentRemoteOnly.indexOf(v) !== -1; },
                isNew: function(v) {
                    var locals = lastBranches ? (lastBranches.local || []) : [];
                    return locals.indexOf(v) === -1 && currentRemoteOnly.indexOf(v) === -1;
                },
                onPick: switchToBranch
            });
            $('#git-branch-combo').append(branchCombo.$el);

            // Upstream picker: lists remote branches; picking one sets it as the
            // current branch's upstream, typing a new name creates that remote
            // branch (push -u) on confirm.
            upstreamCombo = createCombo({
                placeholder: 'Find or create a remote branch',
                allowCreate: true,
                normalizeCreate: function(t) {
                    t = (t || '').replace(/^\/+|\/+$/g, '');
                    if (!t) return null;
                    return t.indexOf('/') === -1 ? 'origin/' + t : t;

                isNew: function(v) { return currentRemoteRefs.indexOf(v) === -1; },

            $('#git-upstream-combo').append(upstreamCombo.$el);

            // Clicking the row icon opens its combo — a bigger target than the

            // header was removed.
            $('#git-branch-row-icon-btn').on('mousedown', function(e) { e.preventDefault(); branchCombo.open(); });
            $('#git-upstream-row-icon-btn').on('mousedown', function(e) { e.preventDefault(); upstreamCombo.open(); });

            // Initialize UI handlers AFTER sidebar is added to DOM
            setupEventHandlers();

            // Load initial data (everything except commits - commits need visible tab)
            loadProjectInfo();
            loadBranches();
            loadChanges();

            // The commit list is DOM, so it renders into a hidden/zero-width
            // container fine - no need to wait for layout (the old canvas did).
            loadCommits(50);

            // Listen to Node-RED deploy events to refresh immediately
            RED.events.on("deploy", function() {
                // Slight delay to allow git operations to complete
                setTimeout(function() {
                    loadAll();
                }, 1000);
            });

            function setupEventHandlers() {
                // Toolbar actions
                $('#git-btn-fetch').on('click', handleFetch);
                $('#git-btn-pull').on('click', handlePull);
                $('#git-btn-push').on('click', handlePush);

                // (The branch picker is a combobox; it calls switchToBranch on pick.)

                // Branch action menu (create / merge / rename / delete / orphan)
                $('#git-branch-menu-btn').on('click', function(e) {
                    e.stopPropagation();
                    $('#git-branch-menu').toggle();
                });
                $('#git-branch-menu').on('click', '.git-branch-menu-item', function() {
                    var act = $(this).attr('data-act');
                    $('#git-branch-menu').hide();
                    handleBranchMenu(act);
                });
                // Close the menu on any outside click (namespaced so re-binds don't stack).
                $(document).off('click.gitbranchmenu').on('click.gitbranchmenu', function() {
                    $('#git-branch-menu').hide();
                });

                // Prompt modal (branch name / branch picker)
                $('#git-prompt-cancel, #git-prompt-close, #git-prompt-overlay').on('click', closePrompt);
                $('#git-prompt-confirm').on('click', submitPrompt);
                $('#git-prompt-input').on('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); submitPrompt(); }
                    else if (e.key === 'Escape') { closePrompt(); }
                });

                // Commit button
                $('#git-btn-commit').on('click', handleCommit);

                // Blocking modal close
                $('#git-blocking-close, #git-blocking-overlay').on('click', function() {
                    $('#git-blocking-modal').fadeOut(200);
                });

                // Diff modal close
                $('#git-diff-close, #git-diff-overlay').on('click', function() {
                    $('#git-diff-modal').fadeOut(150);
                });

                // Expand/collapse a node's field detail inside the diff modal
                $('#git-diff-body').on('click', '.git-diff-node-head', function() {
                    $(this).closest('.git-diff-node').toggleClass('open');
                });

                // Revert a single node (don't also toggle the collapse)
                $('#git-diff-body').on('click', '.git-diff-node-revert', function(e) {
                    e.stopPropagation();
                    revertFlowNode($(this).attr('data-node-id'));
                });

                // Return to latest button (detached HEAD banner)
                $('#git-return-to-latest').on('click', function() {
                    var branchToRestore = null;
                    if (projectInfo) {
                        branchToRestore = projectInfo.currentBranch || projectInfo.lastKnownBranch;
                    }
                    if (branchToRestore) {
                        executeGitOperation('checkout', { commitRef: branchToRestore }, function() {
                            reloadFlowsFromDisk(function() {
                                loadAll();
                            });

                    }

                $('#git-conflict-abort').on('click', function() {
                    var kind = (projectInfo && projectInfo.mergeState && projectInfo.mergeState.kind) || 'operation';
                    if (!confirm('Abort the in-progress ' + kind + '?\n\nThis returns the repo to the state before it started. Any conflict resolutions you have not committed will be lost.')) {
                        return;

                // the heavy resolver UI only mounts when the user asks for it.
                $('#git-conflict-open').on('click', openResolverModal);

                $('#git-resolve-close').on('click', closeResolverModal);
                $('#git-resolve-overlay').on('click', closeResolverModal);
                $(document).on('keydown.gitResolver', function(e) {
                    if (e.key === 'Escape' && $('#git-resolve-modal').is(':visible')) {
                        closeResolverModal();
                    }
                });

                // Bulk fallbacks live in the summary strip inside the modal; event
                // delegation keeps re-renders cheap.
                $('#git-resolve-summary').on('click', '.git-resolve-bulk-ours', function() {
                    mergeResolver.fallback = mergeResolver.fallback === 'ours' ? null : 'ours';
                    renderResolverModal();
                });
                $('#git-resolve-summary').on('click', '.git-resolve-bulk-theirs', function() {
                    mergeResolver.fallback = mergeResolver.fallback === 'theirs' ? null : 'theirs';
                    renderResolverModal();
                });
                $('#git-resolve-summary').on('click', '.git-resolve-bulk-clear', function() {

                $('#git-resolve-body').on('click', '.git-resolve-unit-pick', function(e) {
                    e.stopPropagation();

                $('#git-resolve-body').on('click', '.git-resolve-node-pick', function(e) {

            function resetResolverState() {
                mergeResolver = {
                    preview: null, byNode: {}, byUnit: {}, fallback: null,
                    fileMergeable: false, expanded: {}, showUnchanged: {}, showLong: {},
                    commitMessage: null
                };

            function openResolverModal() {
                if (!mergeResolver.fileMergeable) return;

                // interaction must not clobber what they typed.
                $('#git-resolve-msg').val(mergeResolver.commitMessage || '');
                $('#git-resolve-modal').css('display', 'flex');
                renderResolverModal();
            }
            function closeResolverModal() {
                // Preserve user state so re-opening picks up where they left off;
                // only resolve/abort actually clears mergeResolver.

                    mergeResolver.commitMessage = $('#git-resolve-msg').val();
                }
                $('#git-resolve-modal').hide();
            }

            function loadAll() {
                loadProjectInfo();
                loadBranches();
                loadCommits(50);
                loadChanges();
            }

            function loadProjectInfo() {
                $.ajax({
                    url: 'rosepetal-git/project-info',
                    type: 'GET',
                    success: function(result) {
                        if (result.success) {
                            projectInfo = result;
                            $('#git-project-name').text(result.projectName);
                            currentBranch = result.currentBranch;

                            // Update sync indicators

                            if (result.isDetachedHead) {

                    }
                });

            // Safety-net banner: when a merge/cherry-pick/revert/rebase is
            // mid-flight, show a compact summary. Flow-aware merges get a
            // [Resolve] button that opens the modal; other kinds fall back to
            // the textual file list + Abort.
            function renderConflictBanner(info) {
                var ms = info.mergeState || {};
                var conflicted = info.conflicted || [];
                if (!ms.inProgress && conflicted.length === 0) {
                    $('#git-conflict-banner').slideUp(150);
                    closeResolverModal();
                    resetResolverState();
                    return;

                var kind = ms.kind || 'merge';
                $('#git-conflict-abort span').text('Abort ' + kind);

                if (conflicted.length) {
                    $('#git-conflict-title').text(kind.toUpperCase().replace('-', ' ') + ' CONFLICT');

                    }).join(''));

                    $('#git-conflict-title').text(kind.toUpperCase().replace('-', ' ') + ' IN PROGRESS');

                    $('#git-conflict-files').empty();

                }

            function fetchMergePreview() {
                executeGitOperation('merge/preview', {}, function(preview) {
                    mergeResolver.preview = preview;
                    mergeResolver.fileMergeable = !!preview.flowFileMergeable;
                    var otherFiles = preview.otherFiles || [];

                    if (!preview.flowFileMergeable) {
                        $('#git-conflict-text').text((otherFiles.length
                            ? otherFiles.length + ' file(s) have conflicts.'
                            : 'Conflicts cannot be resolved automatically.')
                            + ' Resolve them in your editor, then commit — or abort.');
                        $('#git-conflict-open').hide();
                        closeResolverModal();
                        return;
                    }

                    if (otherFiles.length) {
                        $('#git-conflict-text').text('flows.json plus ' + otherFiles.length + ' other file(s) have conflicts. Resolve the other files in your editor first, then re-open the resolver.');
                        $('#git-conflict-open').hide();
                        return;
                    }

                    $('#git-conflict-text').text(preview.autoMerged + ' node change(s) auto-merged. Click Resolve to choose a side for the remaining conflicts.');

                    // Re-renders keep the textarea so we don't clobber edits.
                    if (mergeResolver.commitMessage === null) {
                        mergeResolver.commitMessage = preview.mergeMessage || '';
                    }

                        renderResolverModal();

                    $('#git-conflict-text').text('Could not preview the conflict. Use Abort to undo the merge.');
                    $('#git-conflict-open').hide();
                }, { quiet: true });

            // ==================== Resolver Modal Rendering ====================

            function renderResolverModal() {
                if (!mergeResolver.preview || !mergeResolver.fileMergeable) return;
                renderResolverHeader();
                renderResolverSummary();
                renderResolverBody();
                renderResolverFooter();
            }

            function renderResolverHeader() {
                var p = mergeResolver.preview;
                var $ctx = $('#git-resolve-context').empty();
                if (p.theirsRef || p.oursRef) {
                    var line = $('<div></div>').css({ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' });
                    line.append('<span class="git-resolve-chip git-resolve-chip-theirs"><i class="fa fa-cloud-download"></i> ' + escapeHtml(p.theirsRef || '?') + '</span>');
                    line.append('<span class="git-resolve-arrow">→</span>');
                    line.append('<span class="git-resolve-chip git-resolve-chip-ours"><i class="fa fa-code-fork"></i> ' + escapeHtml(p.oursRef || '?') + '</span>');
                    $ctx.append(line);
                }
                var commitLine = function(label, info, cls) {
                    if (!info) return '';
                    var when = info.when ? ' · ' + escapeHtml(info.when.slice(0, 10)) : '';
                    return '<div class="git-resolve-commitline"><span class="' + cls + '">' + label + ':</span> '
                        + '<strong>' + escapeHtml(info.shortHash || '') + '</strong> '
                        + escapeHtml(info.message || '') + ' · ' + escapeHtml(info.author || '') + when + '</div>';
                };
                $ctx.append(commitLine('theirs', p.theirsCommit, 'git-resolve-chip-theirs'));
                $ctx.append(commitLine('ours', p.oursCommit, 'git-resolve-chip-ours'));
            }

            function renderResolverSummary() {
                var p = mergeResolver.preview;
                var conflicts = p.conflicts || [];
                var counts = countResolverRows(conflicts);
                var oursActive   = mergeResolver.fallback === 'ours'   ? ' is-active' : '';
                var theirsActive = mergeResolver.fallback === 'theirs' ? ' is-active' : '';
                var summary = '<span class="git-resolve-counts">'
                    + conflicts.length + ' flow' + (conflicts.length === 1 ? '' : 's') + ' conflict · '
                    + counts.total + ' node conflict' + (counts.total === 1 ? '' : 's') + ' · '
                    + (p.autoMerged || 0) + ' change' + ((p.autoMerged || 0) === 1 ? '' : 's') + ' auto-merged'
                    + '</span>'
                    + '<button class="git-resolve-bulk-ours' + oursActive + '">Take ours for all</button>'
                    + '<button class="git-resolve-bulk-theirs' + theirsActive + '">Take theirs for all</button>'
                    + '<button class="git-resolve-bulk-clear">Clear choices</button>';
                $('#git-resolve-summary').html(summary);
            }

            function countResolverRows(conflicts) {
                var total = 0, unresolved = 0;
                conflicts.forEach(function(unit) {
                    var unitChoice = mergeResolver.byUnit[unit.unitId] || null;
                    if (unit.unitConflict) {
                        total++;
                        if (!unitChoice && !mergeResolver.fallback) unresolved++;
                    }
                    (unit.perNode || []).forEach(function(row) {
                        total++;
                        var hasChoice = mergeResolver.byNode[row.id] || unitChoice || mergeResolver.fallback;
                        if (!hasChoice) unresolved++;
                    });
                });
                return { total: total, unresolved: unresolved };
            }

            function renderResolverBody() {
                var conflicts = mergeResolver.preview.conflicts || [];
                var $body = $('#git-resolve-body').empty();

                if (!conflicts.length) {
                    $body.html('<div class="git-resolve-empty"><i class="fa fa-check-circle" style="color:#2e7d32"></i> Everything auto-merged. Review the commit message below and click Resolve & commit.</div>');
                    return;
                }

                conflicts.forEach(function(unit) {
                    var unitChoice = mergeResolver.byUnit[unit.unitId] || null;
                    var kindLabel = unit.kind === 'subflow' ? 'Subflow'
                        : unit.kind === 'config' ? 'Config'
                        : 'Flow';
                    var $unit = $('<div class="git-resolve-unit"></div>').attr('data-unit-id', unit.unitId);
                    $unit.data('unitId', unit.unitId);

                    var perNodeCount = (unit.perNode || []).length;
                    var $header = $(
                        '<div class="git-resolve-unit-header">'
                        + '<span class="git-resolve-unit-kind">' + escapeHtml(kindLabel) + '</span>'
                        + '<span class="git-resolve-unit-label">' + escapeHtml(unit.label) + '</span>'
                        + (perNodeCount ? '<span class="git-resolve-unit-count">' + perNodeCount + ' conflict' + (perNodeCount === 1 ? '' : 's') + '</span>' : '')
                        + '<button class="git-resolve-unit-pick' + (unitChoice === 'ours' ? ' is-active' : '') + '" data-side="ours">Take ours</button>'
                        + '<button class="git-resolve-unit-pick' + (unitChoice === 'theirs' ? ' is-active' : '') + '" data-side="theirs">Take theirs</button>'
                        + '</div>'
                    );
                    $unit.append($header);

                    if (unit.unitConflict) {
                        var msg = unit.unitConflict === 'modify-delete'
                            ? (unit.deletedSide === 'ours'
                                ? 'Ours deleted this; theirs modified it. Pick "Take ours" to drop it, "Take theirs" to keep their edit.'
                                : 'Theirs deleted this; ours modified it. Pick "Take ours" to keep your edit, "Take theirs" to drop it.')
                            : 'Both sides added this unit with different content. Pick a side.';
                        $unit.append('<div class="git-resolve-unit-structural">' + escapeHtml(msg) + '</div>');
                    }

                    (unit.perNode || []).forEach(function(row) {
                        var nodeChoice = mergeResolver.byNode[row.id] || null;
                        var isExpanded = !!mergeResolver.expanded[row.id];
                        var structural = row.ours === null || row.theirs === null;
                        var iconClass = structural ? 'fa fa-trash is-structural' : 'fa fa-circle is-conflict';

                        var ourLabel = row.ours === null ? 'drop' : 'ours';
                        var theirLabel = row.theirs === null ? 'drop' : 'theirs';
                        var chevron = isExpanded ? 'fa-chevron-down' : 'fa-chevron-right';

                        var $node = $('<div class="git-resolve-node"></div>')
                            .attr('data-node-id', row.id)
                            .data('nodeId', row.id);
                        $node.append(
                            '<div class="git-resolve-node-header git-resolve-node-toggle" title="Click to toggle diff">'
                            + '<i class="git-resolve-node-chevron fa ' + chevron + '"></i>'
                            + '<i class="git-resolve-node-icon ' + iconClass + '"></i>'
                            + '<span class="git-resolve-node-label">' + escapeHtml(nodeDisplayLabel(row))
                            + '<span class="git-resolve-node-id">' + escapeHtml(String(row.id)) + '</span></span>'
                            + nodePickButton('ours', ourLabel, nodeChoice, unitChoice, mergeResolver.fallback)
                            + nodePickButton('theirs', theirLabel, nodeChoice, unitChoice, mergeResolver.fallback)
                            + '</div>'
                        );
                        if (isExpanded) {
                            $node.append(renderFieldDiff(row));
                        }
                        $unit.append($node);
                    });

                    $body.append($unit);
                });
            }

            function nodePickButton(side, label, nodeChoice, unitChoice, fallback) {
                var isChosen = nodeChoice === side;
                var isInherited = !nodeChoice && (unitChoice === side || (!unitChoice && fallback === side));
                var classes = 'git-resolve-node-pick is-' + side;
                if (isChosen) classes += ' is-active';
                else if (isInherited) classes += ' is-active is-inherited';
                return '<button class="' + classes + '" data-side="' + side + '">' + escapeHtml(label) + '</button>';
            }

            function nodeDisplayLabel(row) {
                var n = row.ours || row.theirs || row.base || {};
                var name = n.name || n.label || '';
                var type = n.type || row.kind || 'node';
                return name ? (type + ' "' + name + '"') : type;
            }

            // ==================== Per-Field Diff Rendering ====================

            function renderFieldDiff(row) {
                if (row.ours === null || row.theirs === null) {
                    return renderStructuralFieldDiff(row);
                }
                var ours = row.ours || {};
                var theirs = row.theirs || {};
                var allKeys = Object.keys(ours).concat(Object.keys(theirs));
                allKeys = allKeys.filter(function(k, i) { return allKeys.indexOf(k) === i; });

                var differing = [];
                var unchanged = [];
                allKeys.forEach(function(key) {
                    if (key === 'id' || key === 'type') return;
                    var a = ours[key], b = theirs[key];
                    if (canonicalCompare(a, b)) {
                        unchanged.push(key);
                    } else {
                        differing.push(key);
                    }
                });

                var $grid = $('<div class="git-resolve-fields"></div>');
                $grid.append(
                    '<div class="git-resolve-fields-header">field</div>'
                    + '<div class="git-resolve-fields-header is-ours">ours</div>'
                    + '<div class="git-resolve-fields-header is-theirs">theirs</div>'
                );
                if (!differing.length) {
                    $grid.append('<div style="grid-column: 1 / -1; padding: 6px; color: #888; font-style: italic;">No field-level differences (the only conflict is in id/type — rare).</div>');
                }
                differing.forEach(function(key) {
                    renderFieldRow($grid, row.id, key, ours[key], theirs[key]);
                });
                if (unchanged.length) {
                    var showing = !!mergeResolver.showUnchanged[row.id];
                    $grid.append(
                        '<div class="git-resolve-fields-unchanged" data-key="' + escapeHtml(row.id) + '">'
                        + (showing ? '▾ Hide ' : '▸ Show ') + unchanged.length + ' unchanged field' + (unchanged.length === 1 ? '' : 's')
                        + '</div>'
                    );
                    if (showing) {
                        unchanged.forEach(function(key) {
                            renderFieldRow($grid, row.id, key, ours[key], theirs[key], true);
                        });
                    }
                }
                return $grid;
            }

            function renderStructuralFieldDiff(row) {
                var $box = $('<div style="padding: 8px 12px; font-size: 11px; color: #5d4037;"></div>');
                var present = row.ours || row.theirs;
                $box.html(
                    '<div style="margin-bottom: 6px;"><strong>'
                    + (row.ours === null ? 'Ours deleted this node.' : 'Theirs deleted this node.')
                    + '</strong> Picking the deletion side drops the node entirely; picking the other side keeps the edit below.</div>'
                    + '<pre style="font-family: monospace; font-size: 10px; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; padding: 6px 8px; max-height: 200px; overflow: auto;">'
                    + escapeHtml(JSON.stringify(present, null, 2))
                    + '</pre>'
                );
                return $box;
            }

            function renderFieldRow($grid, nodeId, key, oursVal, theirsVal, isUnchanged) {
                var dim = isUnchanged ? ' style="opacity:0.5;"' : '';
                $grid.append('<div class="git-resolve-field-name"' + dim + '>' + escapeHtml(key) + '</div>');
                $grid.append(renderFieldValue(nodeId, key, oursVal, 'ours'));
                $grid.append(renderFieldValue(nodeId, key, theirsVal, 'theirs'));
                // For long string fields with both sides present, show an inline
                // per-line diff below.
                if (!isUnchanged && isLongString(oursVal) && isLongString(theirsVal)) {
                    var diffKey = nodeId + '|' + key;
                    if (mergeResolver.showLong[diffKey]) {
                        $grid.append(renderInlineLongDiff(String(oursVal), String(theirsVal)));
                    }
                }
            }

            function renderFieldValue(nodeId, key, val, side) {
                var cls = 'git-resolve-field-value is-' + side;
                if (val === undefined) {
                    return '<div class="' + cls + ' is-deleted">(absent)</div>';
                }
                if (val === null) {
                    return '<div class="' + cls + '">null</div>';
                }
                if (typeof val === 'string') {
                    if (isLongString(val)) {
                        var diffKey = nodeId + '|' + key;
                        var expanded = !!mergeResolver.showLong[diffKey];
                        var summary = val.split('\n').length > 1
                            ? '(' + val.split('\n').length + ' lines, ' + val.length + ' chars)'
                            : '(' + val.length + ' chars)';
                        var preview = expanded ? escapeHtml(val) : escapeHtml(val.slice(0, 60) + (val.length > 60 ? '…' : ''));
                        return '<div class="' + cls + '">'
                            + (expanded ? '<pre style="margin:0;white-space:pre-wrap;">' + preview + '</pre>' : '<span>' + preview + '</span>')
                            + ' <a class="git-resolve-expand" data-key="' + escapeHtml(diffKey) + '">' + (expanded ? '▾ collapse' : summary + ' ▸') + '</a>'
                            + '</div>';
                    }
                    return '<div class="' + cls + '">' + escapeHtml(JSON.stringify(val)) + '</div>';
                }
                if (typeof val === 'object') {
                    var diffKey = nodeId + '|' + key;
                    var expanded = !!mergeResolver.showLong[diffKey];
                    var summary = Array.isArray(val)
                        ? '[' + val.length + ' item' + (val.length === 1 ? '' : 's') + ']'
                        : '{' + Object.keys(val).length + ' key' + (Object.keys(val).length === 1 ? '' : 's') + '}';
                    return '<div class="' + cls + '">'
                        + (expanded ? '<pre style="margin:0;white-space:pre-wrap;">' + escapeHtml(JSON.stringify(val, null, 2)) + '</pre>' : '<span>' + escapeHtml(summary) + '</span>')
                        + ' <a class="git-resolve-expand" data-key="' + escapeHtml(diffKey) + '">' + (expanded ? '▾ collapse' : '▸ expand') + '</a>'
                        + '</div>';
                }
                return '<div class="' + cls + '">' + escapeHtml(String(val)) + '</div>';
            }

            function isLongString(v) {
                return typeof v === 'string' && (v.length > 60 || v.indexOf('\n') >= 0);
            }

            // Tiny line-by-line diff: not a real LCS, just a parallel walk that
            // marks lines as same/add/del based on equality. Enough to make
            // small code edits readable without pulling in a diff library.
            function renderInlineLongDiff(a, b) {
                var aLines = a.split('\n');
                var bLines = b.split('\n');
                var n = Math.max(aLines.length, bLines.length);
                var rows = [];
                for (var i = 0; i < n; i++) {
                    var x = aLines[i];
                    var y = bLines[i];
                    if (x === y) {
                        if (x !== undefined) rows.push('<div class="ml-line ml-same">  ' + escapeHtml(x) + '</div>');
                    } else {
                        if (x !== undefined) rows.push('<div class="ml-line ml-del">- ' + escapeHtml(x) + '</div>');
                        if (y !== undefined) rows.push('<div class="ml-line ml-add">+ ' + escapeHtml(y) + '</div>');
                    }
                }
                return '<div class="git-resolve-multiline">' + rows.join('') + '</div>';
            }

            // Compare two JSON-compatible values ignoring object key order.
            function canonicalCompare(a, b) {
                if (a === b) return true;
                if (a === null || b === null) return a === b;
                if (typeof a !== typeof b) return false;
                if (typeof a !== 'object') return a === b;
                if (Array.isArray(a) !== Array.isArray(b)) return false;
                if (Array.isArray(a)) {
                    if (a.length !== b.length) return false;
                    for (var i = 0; i < a.length; i++) if (!canonicalCompare(a[i], b[i])) return false;
                    return true;
                }
                var ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
                if (ak.length !== bk.length) return false;
                for (var j = 0; j < ak.length; j++) {
                    if (ak[j] !== bk[j]) return false;
                    if (!canonicalCompare(a[ak[j]], b[bk[j]])) return false;
                }
                return true;
            }

            function renderResolverFooter() {
                var conflicts = mergeResolver.preview.conflicts || [];
                var counts = countResolverRows(conflicts);
                var $progress = $('#git-resolve-progress');
                if (!conflicts.length) {
                    $progress.text('Ready to commit (everything auto-merged).').addClass('is-ready');
                } else if (mergeResolver.fallback) {
                    $progress.text('Fallback: take ' + mergeResolver.fallback + ' for everything not explicitly chosen.').removeClass('is-ready');
                } else if (counts.unresolved === 0) {
                    $progress.text('All ' + counts.total + ' conflict(s) resolved.').addClass('is-ready');
                } else {
                    $progress.text(counts.unresolved + ' of ' + counts.total + ' conflict(s) still need a choice.').removeClass('is-ready');
                }
                var ready = !conflicts.length || counts.unresolved === 0 || !!mergeResolver.fallback;
                $('#git-resolve-commit').prop('disabled', !ready);
            }

            function updateSyncIndicators(ahead, behind, hasTracking) {
                var $pullIndicator = $('#git-pull-indicator');
                var $pushIndicator = $('#git-push-indicator');
                var $pushBtn = $('#git-btn-push');

                if (behind > 0) {
                    $pullIndicator.text(behind).show();
                } else {
                    $pullIndicator.hide();
                }

                if (ahead > 0) {
                    $pushIndicator.text(ahead).show();
                } else {
                    $pushIndicator.hide();
                }

                var canPush = (ahead > 0) || !hasTracking;
                $pushBtn.prop('disabled', !canPush);

                if (!hasTracking) {
                    $pushBtn.attr('title', 'Push to publish this branch');
                } else if (ahead > 0 && behind > 0) {
                    $pushBtn.attr('title', 'Branch has diverged from remote — push will offer a force-push or you can pull first');
                } else {
                    $pushBtn.attr('title', 'Push to remote');
                }
            }

            function loadBranches() {
                $.ajax({
                    url: 'rosepetal-git/branches',
                    type: 'POST',
                    data: JSON.stringify({}),
                    contentType: 'application/json',
                    success: function(result) {
                        if (!result.success) return;
                        lastBranches = result;
                        currentRemoteOnly = result.remoteOnly || [];
                        currentRemoteRefs = result.remoteBranches || [];
                        if (branchCombo) {
                            branchCombo.setValues(result.all || []);
                            branchCombo.setValue(result.current || '');
                        }
                        if (upstreamCombo) {
                            // The current branch's upstream goes in the input (marked as
                            // "current" in the list); not tracking → empty + a placeholder
                            // that surfaces what the next push will do.
                            upstreamCombo.setValues(result.remoteBranches || []);
                            upstreamCombo.setValue(result.tracking || '');
                            upstreamCombo.$input.attr('placeholder', result.tracking
                                ? 'Find or create a remote branch'
                                : (result.current ? 'Not tracking — push creates origin/' + result.current
                                                  : 'Find or create a remote branch'));
                        }
                        if (branchCombo) {
                            branchCombo.$input.attr('placeholder', result.current
                                ? 'Find or create a branch'
                                : 'Detached HEAD — pick a branch to switch');
                        }
                        // Detached HEAD has no upstream concept — hide the row.
                        $('#git-upstream-row').toggle(!!result.current);
                    }
                });
            }

            // Local branch names (the ones we can merge from / delete), derived from
            // the simple-git branch map so remote-only names never sneak in.
            function localBranchNames() {
                if (!lastBranches || !lastBranches.branches) return [];
                return Object.keys(lastBranches.branches).filter(function(n) {
                    return n.indexOf('remotes/') !== 0;
                });
            }

            // ---------- Type-to-filter combobox ----------
            // A text input + filtered dropdown list. opts: { values, value,
            // placeholder, onPick(value) }. Typing filters in real time; picking
            // (click / Enter) fires onPick. An invalid typed value is restored on
            // blur, so the control never holds a value that isn't in the list.
            function createCombo(opts) {
                opts = opts || {};
                var values = opts.values || [];
